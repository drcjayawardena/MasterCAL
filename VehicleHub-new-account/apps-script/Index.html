<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VehicleHub</title>
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #f3f5f8; --card: #ffffff; --text: #1b2430; --muted: #687384; --line: #e2e6eb;
      --primary: #14213d; --primary-2: #1a66e0; --accent: #1f8a5b; --wa: #1fae55;
      --warn: #b86e00; --bad: #b23b3b; --buyer: #4c7ee8; --seller: #e0912f; --chip: #eef2f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans Sinhala", "Iskoola Pota", sans-serif; }
    a { color: inherit; }
    h2 { font-size: 17px; margin: 22px 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }

    /* ---------- Header / nav ---------- */
    header { background: var(--primary); color: #fff; position: sticky; top: 0; z-index: 10; }
    .hbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; gap: 8px; }
    .brand { font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 10px; letter-spacing: .2px; }
    .brand b { color: #6aa5ff; font-weight: 700; }
    .brand-logo { width: 38px; height: 38px; border-radius: 50%; background: #fff; flex: none; }
    .ic { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round;
      stroke-linejoin: round; vertical-align: -0.2em; flex: none; }
    .ic.h { color: var(--primary-2); }
    nav button { display: flex; align-items: center; gap: 10px; }
    .navcount:empty { display: none; }
    .navcount { font-style: normal; background: #e0912f; color: #fff; font-size: 11px; font-weight: 700;
      border-radius: 99px; padding: 1px 7px; margin-left: auto; }
    .badge.warn { background: #fff3dc; color: #9a5b00; }
    .toast { display: flex; align-items: center; gap: 8px; }
    /* ---------- Vehicle thumbnails ---------- */
    .vrow { display: flex; gap: 12px; align-items: flex-start; }
    .vrow > div:last-child { min-width: 0; flex: 1; }
    .vthumb { width: 96px; height: 72px; border-radius: 10px; flex: none; background: linear-gradient(135deg, #eef3fb, #dde6f3);
      background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center;
      color: #9fb0c8; overflow: hidden; border: 1px solid var(--line); }
    .vthumb .ic { width: 38px; height: 38px; stroke-width: 1.5; }
    .vthumb.has { cursor: pointer; }
    .vthumb.loaded .ic { display: none; }
    .vthumb.lg { width: 120px; height: 90px; }
    .login-logo { width: 100%; max-width: 280px; align-self: center; display: block; margin: 0 auto 4px; }
    .login-logo.small { max-width: 200px; }
    .grid.wide { grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); }
    .login .link { font: inherit; }
    .deal { border-left: 4px solid var(--accent); display: flex; flex-direction: column; gap: 10px; }
    .deal .dh { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .deal .dh .ok { color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .deal .price { font-weight: 700; font-size: 17px; }
    .deal .party { background: #f6f8fb; border-radius: 8px; padding: 8px 10px; }
    .deal .party .lbl { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; align-items: center; gap: 5px; }
    .verwarn { position: fixed; right: 16px; bottom: 16px; max-width: 420px; z-index: 60; background: #fff4e5;
      color: #7a4d00; border: 1px solid #f3d9a4; border-radius: 12px; padding: 12px 14px; font-size: 14px;
      gap: 10px; align-items: flex-start; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .verwarn .ic { color: #c77700; margin-top: 2px; }
    .loaderr { text-align: center; padding: 40px 16px; grid-column: 1 / -1; color: var(--muted); }
    .loaderr .ic { width: 40px; height: 40px; color: var(--bad); stroke-width: 1.6; }
    .loaderr b { display: block; color: var(--text); margin: 10px 0 6px; font-size: 16px; }
    .approve-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .btn.red { background: #fbe9e9; color: var(--bad); }
    .who { font-size: 13px; opacity: .85; display: flex; gap: 10px; align-items: center; }
    .who button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    nav { display: flex; gap: 2px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { background: none; border: 0; color: #cfd9e6; padding: 10px 12px; font-size: 14px; cursor: pointer;
      white-space: nowrap; border-bottom: 3px solid transparent; }
    nav button.on { color: #fff; border-bottom-color: #6aa5ff; font-weight: 600; }

    main { padding: 16px; max-width: 1200px; margin: 0 auto; }
    .fbnav { display: flex; align-items: center; gap: 10px; color: #cfd9e6; text-decoration: none; padding: 10px 12px;
      font-size: 14px; white-space: nowrap; border-radius: 6px; }
    .fbnav:hover { color: #fff; background: rgba(24,119,242,.25); }
    .fbnav .ic { color: #6aa5ff; }
    .fblogin { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; padding: 9px;
      border-radius: 8px; background: #e7f0fe; color: #1877f2; font-weight: 600; font-size: 14px; text-decoration: none; }
    .fblogin:hover { background: #d6e6fd; }

    /* ---------- Desktop: left sidebar ---------- */
    @media (min-width: 900px) {
      header { position: fixed; top: 0; left: 0; bottom: 0; width: 210px; display: flex; flex-direction: column; }
      .hbar { flex-direction: column; align-items: flex-start; padding: 18px 16px; gap: 10px;
        border-bottom: 1px solid rgba(255,255,255,.12); }
      .who { flex-direction: column; align-items: flex-start; gap: 8px; }
      .who .uname { display: inline; }
      nav { flex-direction: column; padding: 10px 8px; gap: 4px; overflow: visible; flex: 1; }
      nav button { text-align: left; border-bottom: 0; border-left: 3px solid transparent; border-radius: 6px;
        padding: 11px 12px; font-size: 15px; width: 100%; }
      nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
      nav button.on { background: rgba(255,255,255,.12); border-left-color: #6aa5ff; }
      .fbnav { margin-top: auto; padding: 11px 12px 11px 15px; font-size: 15px; border-top: 1px solid rgba(255,255,255,.12); border-radius: 0; }
      main { margin-left: 210px; max-width: none; padding: 20px 28px; }
      main > * { max-width: 1200px; }
    }

    /* ---------- Common ---------- */
    .btn { border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--chip); color: var(--text); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.green { background: var(--accent); color: #fff; }
    .btn.wa { background: var(--wa); color: #fff; }
    .btn.sm { padding: 6px 10px; font-size: 13px; }
    .btn.big { padding: 14px 18px; font-size: 15px; flex: 1; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .narrow { max-width: 760px; margin: 0 auto; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .toolbar input, .toolbar select { flex: 1 1 150px; min-width: 0; }
    input, select, textarea { font: inherit; font-size: 15px; padding: 9px 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; color: var(--text); width: 100%; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #a9c6f5; border-color: #7fa7e6; }
    textarea { min-height: 60px; resize: vertical; }
    label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    label.f.req span::after { content: ' *'; color: var(--bad); }
    .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .form .full { grid-column: 1 / -1; }
    .sec { grid-column: 1 / -1; font-weight: 600; font-size: 13px; color: var(--primary-2); border-bottom: 1px solid var(--line);
      padding-bottom: 4px; margin-top: 6px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--primary); white-space: nowrap; }
    .badge.ok { background: #e6f4ec; color: var(--accent); }
    .badge.off { background: #f4e7e7; color: var(--bad); }
    .empty, .loading { text-align: center; color: var(--muted); padding: 36px 0; grid-column: 1 / -1; }

    /* ---------- Loading animations ---------- */
    /* Spinner shown wherever the app says "Loading…" */
    .loading { display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 14px; }
    .loading::before { content: ''; width: 42px; height: 42px; border-radius: 50%;
      border: 4px solid #dbe5f4; border-top-color: var(--primary-2); border-right-color: var(--primary-2);
      animation: vh-spin .8s linear infinite; }
    @keyframes vh-spin { to { transform: rotate(360deg); } }

    /* Thin progress bar at the very top while the server is working */
    #netbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; pointer-events: none;
      opacity: 0; transition: opacity .2s; overflow: hidden; }
    #netbar.on { opacity: 1; }
    #netbar::before { content: ''; position: absolute; top: 0; bottom: 0; width: 40%;
      background: linear-gradient(90deg, transparent, #6aa5ff, var(--primary-2), transparent);
      animation: vh-slide 1.1s ease-in-out infinite; }
    @keyframes vh-slide { from { left: -40%; } to { left: 100%; } }

    /* Buttons show a small spinner while their action is running */
    .btn:disabled { position: relative; color: transparent !important; opacity: .9; cursor: wait; }
    .btn:disabled .ic { opacity: 0; }
    .btn:disabled::after { content: ''; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
      margin: -8px 0 0 -8px; border-radius: 50%; border: 2px solid rgba(128,140,160,.35);
      border-top-color: #5a6b85; animation: vh-spin .7s linear infinite; }
    .btn.primary:disabled::after, .btn.green:disabled::after { border-color: rgba(255,255,255,.35); border-top-color: #fff; }

    /* Skeleton cards while lists load */
    .skel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
      display: flex; gap: 12px; }
    .skel i { display: block; border-radius: 8px;
      background: linear-gradient(90deg, #eef2f7 25%, #f7f9fc 50%, #eef2f7 75%); background-size: 200% 100%;
      animation: vh-shimmer 1.2s ease-in-out infinite; }
    .skel .sq { width: 96px; height: 72px; flex: none; }
    .skel .lines { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
    .skel .ln { height: 12px; }
    @keyframes vh-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* Start-up splash with the logo */
    .splash { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .splash img { width: 120px; height: 120px; border-radius: 50%; background: #fff;
      box-shadow: 0 8px 30px rgba(20,33,61,.15); animation: vh-pulse 1.4s ease-in-out infinite; }
    .splash .dots { display: flex; gap: 6px; }
    .splash .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-2);
      animation: vh-dot 1s ease-in-out infinite; }
    .splash .dots span:nth-child(2) { animation-delay: .15s; }
    .splash .dots span:nth-child(3) { animation-delay: .3s; }
    .splash .muted { font-size: 14px; }
    @keyframes vh-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes vh-dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .loading::before, #netbar::before, .skel i, .splash img, .splash .dots span, .btn:disabled::after { animation-duration: 3s; }
    }
    .chipbar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
    .chipbar .badge { font-size: 13px; padding: 4px 10px; }
    .chipbar button { border: 0; background: none; cursor: pointer; color: var(--bad); font-size: 13px; }
    .check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); flex: 0 0 auto; }
    .check input { width: auto; }

    /* ---------- Stat tiles ---------- */
    .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
    .tile b { display: block; font-size: 26px; line-height: 1.1; }
    .tile span { font-size: 13px; color: var(--muted); }

    /* ---------- Record cards ---------- */
    .rec { display: flex; flex-direction: column; gap: 6px; }
    .rec .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .rec .title { font-weight: 600; }
    .rec .sub { font-size: 13px; color: var(--muted); }
    .rec .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .rec.buyer { border-left: 4px solid var(--buyer); }
    .rec.seller { border-left: 4px solid var(--seller); }

    /* ---------- Match cards ---------- */
    .match { display: flex; flex-direction: column; gap: 10px; }
    .match .top { display: flex; justify-content: space-between; align-items: center; }
    .score { font-weight: 700; font-size: 22px; }
    .score.hi { color: var(--accent); } .score.mid { color: var(--warn); } .score.lo { color: var(--bad); }
    .reasons { display: flex; gap: 4px; flex-wrap: wrap; }
    .reasons span { font-size: 12px; background: #eef7f2; color: var(--accent); padding: 2px 7px; border-radius: 6px; }
    .side { border-left: 3px solid var(--line); padding-left: 10px; }
    .side.b { border-color: var(--buyer); } .side.s { border-color: var(--seller); }
    .side h4 { margin: 0 0 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .side .main { font-weight: 600; }
    .side .sub { font-size: 13px; color: var(--muted); }
    .side .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .medit { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .medit textarea { grid-column: 1 / -1; min-height: 42px; font-size: 14px; }
    .medit select, .medit input { font-size: 14px; padding: 7px 8px; }
    .meta { font-size: 12px; color: var(--muted); }
    .officer { background: #f4f6fb; border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
    .officer .lbl { font-size: 12px; color: var(--muted); }
    .officer .nm { font-weight: 600; }
    .mine-tag { font-size: 11px; background: #e6f4ec; color: var(--accent); padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
    .utable { width: 100%; border-collapse: collapse; font-size: 14px; }
    .utable td, .utable th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    .utable input, .utable select { padding: 6px 8px; font-size: 14px; }
    .utable select { min-width: 90px; }
    .utable .check input { width: auto; }
    .uwrap { overflow-x: auto; }
    .photo-pick { display: flex; flex-direction: column; gap: 6px; }
    /* ---------- Photo blur editor ---------- */
    .pe-back { position: fixed; inset: 0; background: rgba(10,16,24,.82); z-index: 100; display: flex;
      align-items: center; justify-content: center; padding: 12px; }
    .pe { background: var(--card); border-radius: 12px; padding: 14px; width: min(960px, 100%); max-height: 100%;
      display: flex; flex-direction: column; gap: 10px; overflow: auto; }
    .pe h3 { margin: 0; font-size: 16px; }
    .pe canvas { max-width: 100%; max-height: 68vh; align-self: center; touch-action: none; cursor: crosshair;
      border-radius: 8px; background: #000; }
    .pe .row { justify-content: flex-end; }
    .gal-img { max-width: 100%; max-height: 70vh; align-self: center; border-radius: 8px; background: #000; min-height: 120px; }
    .gal-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .login .link { background: none; border: 0; color: var(--primary-2); cursor: pointer; font-size: 14px; text-decoration: underline; padding: 4px; }
    .login .ok { color: var(--accent); font-size: 14px; }
    .savedbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      border-left: 4px solid var(--accent); margin-bottom: 4px; }
    .savedbar .t { font-weight: 600; font-size: 16px; }
    .savedbar .row { flex: 0 1 auto; }
    .ext { background: #fff4e0; color: #7a4d00; }
    .extbox { background: #fffaf0; border: 1px solid #f3e1bb; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
    .extbox .lbl { font-size: 13px; color: #7a4d00; margin-bottom: 6px; }
    .notice { background: #fff6e5; border: 1px solid #f3d9a4; color: #7a4d00; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }

    /* ---------- Login ---------- */
    .login { max-width: 360px; margin: 12vh auto 0; padding: 0 16px; }
    .login .card { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .login h1 { margin: 0; font-size: 22px; color: var(--primary); }
    .err { color: var(--bad); font-size: 14px; min-height: 18px; }

    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1b2430; color: #fff;
      padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
      z-index: 50; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; } .toast.bad { background: var(--bad); }

    @media (max-width: 520px) {
      main { padding: 12px; }
      .grid, .grid.wide { grid-template-columns: 1fr; }
      .who .uname { display: none; }
    }
  </style>

      function runner(ok, fail) {
        return new Proxy({}, {
          get: function (_, name) {
            if (name === 'withSuccessHandler') return function (f) { return runner(f, fail); };
            if (name === 'withFailureHandler') return function (f) { return runner(ok, f); };

              var args = Array.prototype.slice.call(arguments);

                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // "simple" request → no CORS pre-flight
                body: JSON.stringify({ fn: name, args: args })

function netStart() { netCount++; const b = $('netbar'); if (b) b.classList.add('on'); }

}

function call(action, payload) {
  netStart();
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(r => { netEnd(); resolve(r); })
      .withFailureHandler(err => {
        netEnd();
        const msg = String((err && err.message) || err);
        if (msg.indexOf('SESSION_EXPIRED') > -1) { toast('Session expired — please log in again', true); logout(true); }
        else {
          const clean = msg.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');
          toast(clean, true);
          showLoadError(clean);
        }
        resolve(null);
      })
      .api(S.token, action, payload || {});
  });
}

/* ============================================================
 *  SEARCH ON ikman.lk / riyasewana.com

const slugify = s => String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
// Our vehicle types → the category names used in each site's URLs
const RS_TYPE = { 'car': 'cars', 'suv / jeep': 'suvs', 'van': 'vans', 'cab / pickup': 'pickups',
  'motorcycle': 'motorcycles', 'three wheeler': 'three-wheels', 'lorry': 'lorries' };
const RS_WANTED = 'https://riyasewana.com/wanted.php';
const IK_TYPE = { 'car': 'cars', 'van': 'vans', 'motorcycle': 'motorbikes-scooters' };

/** o = buyer (uses year_from/year_to) or vehicle (uses year). */
function extSearchUrls(o, isBuyer) {
  const type = String(o.vehicle_type || '').trim().toLowerCase();
  const mk = slugify(o.make), md = slugify(o.model);
  let yf = isBuyer ? o.year_from : o.year, yt = isBuyer ? o.year_to : o.year;
  if (yf && !yt) yt = new Date().getFullYear();
  if (yt && !yf) yf = 1980;

  // riyasewana.com/search/<type>/<make>/<model>/<from>-<to>
  let rs = 'https://riyasewana.com/search';
  const rt = RS_TYPE[type];
  if (rt) {
    rs += '/' + rt;
    if (mk) { rs += '/' + mk; if (md) { rs += '/' + md; if (yf && yt) rs += '/' + yf + '-' + yt; } }
  }

  // ikman.lk/en/ads/sri-lanka/<category>/<make>/<model>  (or keyword search)
  let ik;
  const it = IK_TYPE[type];
  // ikman uses its own spellings for multi-word names (e.g. "wagonr"), so those use keyword search
  const simple = !/-/.test(mk) && !/-/.test(md);
  if (it && simple) {
    ik = 'https://ikman.lk/en/ads/sri-lanka/' + it + (mk ? '/' + mk + (md ? '/' + md : '') : '');
  } else {
    const q = slugify([o.make, o.model].filter(Boolean).join(' ') || o.vehicle_type || 'vehicles');
    ik = 'https://ikman.lk/en/ads/q/sri-lanka/' + q;
  }
  return { ikman: ik, riyasewana: rs };
}

/** Small 4:3 cover image made in the browser from the first uploaded photo. */
function makeThumb(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const W = 360, H = 270, c = document.createElement('canvas'); c.width = W; c.height = H;
      const r = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      const w = img.naturalWidth * r, h = img.naturalHeight * r;
      c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      resolve(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => resolve('');
    img.src = dataUrl;
  });
}

/** Shrinks a photo in the browser before upload (max 1600px JPEG) so uploads are fast. */
function resizeImage(file, max, quality) {
  max = max || 1600; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name)); };
    img.src = url;
  });
}

async function uploadPhotos(vehicleId, files) {
  files = Array.from(files || []).slice(0, 10);
  let last = null, done = 0;
  for (let i = 0; i < files.length; i++) {
    let data;
    try { data = await resizeImage(files[i]); } catch (e) { toast(e.message, true); continue; }
    data = await blurEditor(data, i + 1, files.length);   // let the officer hide the number plate
    if (!data) continue;                                   // photo skipped
    toast(`Uploading photo ${i + 1} of ${files.length}…`);
    const thumb = await makeThumb(data);
    const r = await call('uploadPhoto', { vehicleId, data, thumb });
    if (r) { last = r; done++; }
  }
  if (last) { toast(`${done} photo(s) uploaded`); delete S.thumbs[vehicleId]; }
  return last;
}

/* ------------------------------------------------------------
 *  NUMBER-PLATE BLUR EDITOR
 *  Drag a box over the number plate (or anything private) → that area is pixelated.
 *  The blur is baked into the JPEG before upload, so the original is never sent.
 *  Resolves with the edited image (data URL), or null if the photo is skipped.
 * ------------------------------------------------------------ */
function blurEditor(dataUrl, n, total) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const back = document.createElement('div');
      back.className = 'pe-back';
      back.innerHTML = `<div class="pe">
        <h3>${ic('camera')} Photo ${n} of ${total} — drag a box over the number plate to blur it</h3>
        <div class="muted">You can draw several boxes (plate, faces, documents). Nothing is uploaded until you press Upload.</div>
        <canvas id="pe_c"></canvas>
        <div class="row">
          <button class="btn" id="pe_undo">${ic('undo')} Undo</button>
          <button class="btn" id="pe_skip">${ic('x')} Skip this photo</button>
          <button class="btn green" id="pe_ok">${ic('upload')} Upload</button>
        </div></div>`;
      document.body.appendChild(back);

      const c = back.querySelector('#pe_c'), ctx = c.getContext('2d');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const boxes = [];
      let start = null, cur = null;

      const redraw = () => {
        ctx.drawImage(img, 0, 0);
        boxes.forEach(b => pixelate(ctx, b));
        if (start && cur) {
          ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = Math.max(3, c.width / 300);
          ctx.setLineDash([12, 8]);
          ctx.strokeRect(start.x, start.y, cur.x - start.x, cur.y - start.y);
          ctx.setLineDash([]);
        }
      };
      const pos = e => {
        const r = c.getBoundingClientRect();
        return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
      };
      c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); start = cur = pos(e); });
      c.addEventListener('pointermove', e => { if (start) { cur = pos(e); redraw(); } });
      c.addEventListener('pointerup', () => {
        if (start && cur) {
          const b = { x: Math.min(start.x, cur.x), y: Math.min(start.y, cur.y),
                      w: Math.abs(cur.x - start.x), h: Math.abs(cur.y - start.y) };
          if (b.w > 8 && b.h > 8) boxes.push(b);
        }
        start = cur = null; redraw();
      });
      redraw();

      const close = val => { back.remove(); resolve(val); };
      back.querySelector('#pe_undo').onclick = () => { boxes.pop(); redraw(); };
      back.querySelector('#pe_skip').onclick = () => close(null);
      back.querySelector('#pe_ok').onclick = () => { start = cur = null; redraw(); close(c.toDataURL('image/jpeg', 0.85)); };
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/** Strong mosaic over a box — irreversible once saved as JPEG. */
function pixelate(ctx, b) {
  const x = Math.max(0, Math.round(b.x)), y = Math.max(0, Math.round(b.y));
  const w = Math.min(ctx.canvas.width - x, Math.round(b.w)), h = Math.min(ctx.canvas.height - y, Math.round(b.h));
  if (w < 2 || h < 2) return;
  const block = Math.max(10, Math.round(Math.min(w, h) / 4));
  const t = document.createElement('canvas');
  t.width = Math.max(1, Math.ceil(w / block)); t.height = Math.max(1, Math.ceil(h / block));
  const tc = t.getContext('2d');
  tc.drawImage(ctx.canvas, x, y, w, h, 0, 0, t.width, t.height);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(t, 0, 0, t.width, t.height, x, y, w, h);
  ctx.restore();
}

function applyInit(r) {

/** Warns clearly when the three files are from different updates. */
function checkVersions(v) {
  const msgs = [];
  if (!v) msgs.push('<b>Code.gs</b> on Apps Script is out of date.');
  else {
    if (v.code !== APP_VERSION) msgs.push(v.code > APP_VERSION || !APP_VERSION
      ? 'This page (<b>index.html</b>) is older than the server. Upload the latest index.html.'
      : '<b>Code.gs</b> on Apps Script is out of date (server ' + esc(v.code) + ', page ' + APP_VERSION + ').');
    if (v.matching !== v.code) msgs.push('<b>Matching.gs</b> on Apps Script is out of date — paste the latest Matching.gs.');
  }
  const box = $('verwarn');
  if (!box) return;
  box.innerHTML = msgs.length ? ic('alert') + '<div>' + msgs.join('<br>') +
    '<br><span class="muted">After updating Apps Script files: Deploy → Manage deployments → Edit → New version → Deploy.</span></div>' : '';
  box.style.display = msgs.length ? 'flex' : 'none';
}

async function saveBuyer(e) {
  e.preventDefault();
  const d = collect('b', BUYER_FIELDS);
  d.buyer_id = S.params.id || '';

  // district / fuel / transmission stay blank (= any), so no hidden filter limits matching.
  const old = d.buyer_id ? (S.rec[d.buyer_id] || {}) : (S.params.prefill || {});
  d.lead_id = d.buyer_id ? '' : (S.params.lead || '');
  d.show_wanted = $('b_show_wanted') && !$('b_show_wanted').checked ? 'No' : 'Yes';
  d.phone2 = old.phone2 || '';
  d.notes = old.notes || '';
  const btn = $('b_save'); btn.disabled = true;
  const r = await call('saveBuyer', d);
  btn.disabled = false;
  if (!r) return;
  S.rec[r.id] = r.buyer;
  if (r.master) S.master = r.master;
  toast('Saved — ' + r.id);
  S.lastMatches = r.matches;
  go('results', { kind: 'buyer', id: r.id });   // hide the call details, show only the matches
}

/** Admin: delete a buyer / vehicle and all of its matches. */
async function deleteRecord(kind, id) {
  const what = kind === 'buyer' ? 'buyer' : 'vehicle';
  const extra = kind === 'buyer' ? '' : ' Its photos will be moved to the Google Drive trash.';
  if (!confirm(`Delete ${what} ${id} permanently?\n\nAll matches of this ${what} will be deleted too.${extra}\n\nThis cannot be undone.`)) return;
  const r = await call('deleteRecord', { kind: kind, id: id });
  if (!r) return;
  delete S.rec[id];
  toast(`Deleted ${id} (${r.matchesDeleted} match${r.matchesDeleted === 1 ? '' : 'es'} removed)`);
  go(kind === 'buyer' ? 'buyers' : 'vehicles');
}

function leadCard(l) {

  const age = l.age_hours === '' ? '' : (l.age_hours < 1 ? 'just now' : l.age_hours < 48 ? l.age_hours + ' h ago' : Math.floor(l.age_hours / 24) + ' days ago');
  const late = l.status === 'New' && Number(l.age_hours) >= 2;
  const si = l.lang !== 'en';
  const wa = si
    ? `ආයුබෝවන් ${l.name}, VehicleHub වෙත ඔබ එවූ ඉල්ලීම (${l.lead_id}) ලැබුණා. මම ${S.user.full_name}. ${buyer ? 'ඔබ සොයන වාහනය' : 'ඔබගේ වාහනය'} ගැන කතා කරන්න ඔබට පහසු වෙලාවක් කියන්න පුළුවන්ද?`
    : `Hello ${l.name}, this is ${S.user.full_name} from VehicleHub about your request ${l.lead_id}. When is a good time to talk?`;
  const open = l.status === 'New' || l.status === 'Contacted';
  return `<div class="card rec ${buyer ? 'buyer' : 'seller'}">
    <div class="top"><div>
      <div class="title">${esc(l.name)} <span class="badge ${buyer ? '' : 'warn'}">${buyer ? 'Buyer' : 'Seller'}</span></div>
      <div class="muted">${esc(l.lead_id)} · ${esc(fmtDT(l.created_at))}${age ? ' · ' + esc(age) : ''}${late ? ` · <b style="color:#c0392b">waiting — call now</b>` : ''}</div></div>
      ${statusBadge(l.status, ['New'])}</div>
    <div>${ic(buyer ? 'search' : 'car')} ${esc(l.summary)}</div>
    ${l.notes ? `<div class="sub">${ic('note')} ${esc(l.notes)}</div>` : ''}

    ${l.status === 'Rejected' && l.reject_reason ? `<div class="sub">${ic('ban')} ${esc(l.reject_reason)}</div>` : ''}
    ${l.status === 'Converted' ? `<div class="sub">${ic('check')} Saved as ${esc(l.converted_id)}</div>` : ''}
    <div class="actions">
      ${phoneBtns(l.phone, wa)}
      ${Number(l.photo_count) ? `<button class="btn sm" onclick="showLeadPhotos('${esc(l.lead_id)}')">${ic('camera')} Photos (${esc(l.photo_count)})</button>` : ''}
      ${open ? `
        ${l.status === 'New' ? `<button class="btn sm" onclick="setLead('${esc(l.lead_id)}','Contacted')">${ic('check')} Mark contacted</button>` : ''}
        <button class="btn sm green" onclick="convertLead('${esc(l.lead_id)}')">${ic(buyer ? 'user' : 'car')} Save as ${buyer ? 'Buyer' : 'Vehicle'}</button>

    </div>
    ${S.user.role === 'admin' && open ? `<div class="row" style="margin-top:8px"><span class="muted">${ic('shield')} Assigned to</span>
      <select onchange="reassignLead('${esc(l.lead_id)}', this.value)">

  </div>`;
}

async function setLead(id, status, reason) {
  const r = await call('updateLead', { leadId: id, status, reason });

}
function rejectLead(id) {
  const reason = prompt('Why reject this request? (e.g. fake number, not interested)');
  if (reason === null) return;
  setLead(id, 'Rejected', reason);
}
async function reassignLead(id, username) {
  if (!username) return;
  const r = await call('updateLead', { leadId: id, assignTo: username });
  if (r) toast('Request ' + id + ' → ' + r.lead.assigned_name);
}
function convertLead(id) {
  const l = S.leads[id]; if (!l) return;
  const notes = [l.leasing === 'Yes' ? 'Needs leasing.' : '', l.notes || '', '(Website request ' + l.lead_id + ')'].filter(Boolean).join(' ');

      name: l.name, phone: l.phone, vehicle_type: l.vehicle_type, make: l.make, model: l.model,
      year_from: l.year_from, year_to: l.year_to, min_budget: l.min_budget, max_budget: l.max_budget, notes } });
  } else {
    go('vehicleForm', { phone: l.phone, lead: l.lead_id, prefill: {

      year: l.year, price: l.price, notes, photo_count: l.photo_count } });
  }
}

async function saveVehicle(e) {
  e.preventDefault();
  const d = collect('v', VEHICLE_FIELDS);
  d.vehicle_id = S.params.id || '';
  // Fields removed from the form: keep whatever an existing vehicle already has
  // (notes also hold the admin's rejection reason).
  const old = d.vehicle_id ? (S.rec[d.vehicle_id] || {}) : (S.params.prefill || {});
  d.lead_id = d.vehicle_id ? '' : (S.params.lead || '');
  d.show_public = $('v_show_public') && $('v_show_public').checked ? 'Yes' : 'No';
  ['phone2', 'district', 'mileage', 'fuel', 'transmission', 'notes'].forEach(f => { d[f] = old[f] == null ? '' : String(old[f]); });
  const btn = $('v_save'); btn.disabled = true;
  const r = await call('saveVehicle', d);
  btn.disabled = false;
  if (!r) return;
  S.rec[r.id] = r.vehicle;
  if (r.master) S.master = r.master;
  toast('Saved — ' + r.id);
  const files = $('v_photos') && $('v_photos').files ? Array.from($('v_photos').files) : [];
  S.lastMatches = r.matches;
  delete S.thumbs[r.id];
  go('results', { kind: 'vehicle', id: r.id, pending: r.pending });   // hide the call details, show only the matches
  if (files.length) {
    const up = await uploadPhotos(r.id, files);
    if (up) {
      Object.assign(S.rec[r.id], up);
      if (S.view === 'results' && S.params.id === r.id) renderResults();
    }
  }
}

  if (!r || S.view !== 'deals') return;
  const label = m => { if (m === 'all') return 'All time'; const d = new Date(m + '-01T00:00:00');
    return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); };
  const thisMonth = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 7);
  const months = [...new Set([thisMonth].concat(r.months))].sort().reverse();
  $('d_month').innerHTML = months.map(m => `<option value="${m}" ${m === r.month ? 'selected' : ''}>${label(m)}</option>`).join('') +
    `<option value="all" ${r.month === 'all' ? 'selected' : ''}>All time</option>`;
  $('d_sum').innerHTML = `
    <div class="tile"><b>${r.deals.length}</b><span>${ic('award')} Deals — ${esc(label(r.month))}</span></div>
    <div class="tile"><b>${esc(r.total)}</b><span>${ic('tag')} Total value (Lakhs)</span></div>`;

  $('list').innerHTML = r.deals.map(dealCard).join('') ||
    `<div class="empty">${ic('award')} No closed deals for ${esc(label(r.month))}</div>`;
}

async function decideVehicle(id, approve, btn) {
  let note = '';
  if (!approve) {
    note = prompt('Reason for rejecting (the officer will see this in the notes):', '');
    if (note === null) return;
  }
  btn.disabled = true;
  const r = await call('approveVehicle', { vehicleId: id, approve, note });
  btn.disabled = false;
  if (!r) return;
  if (S.rec[id]) S.rec[id].status = r.status;
  toast(approve ? `Approved — ${r.matches} matching buyer(s) found` : 'Vehicle rejected');
  const card = $('ap_' + id); if (card) card.remove();
  const left = document.querySelectorAll('[id^="ap_"]').length;
  setNavCount('approvals', left);
  if (!left && $('list')) $('list').innerHTML = `<div class="empty">${ic('check')} Nothing to approve right now</div>`;
}
function setNavCount(tab, n) { const el = $('nc_' + tab); if (el) el.textContent = n ? String(n) : ''; }

      <select id="m_st" onchange="renderMatches()">${opts(S.lists.MATCH_STATUS, p.deals ? dealStatus() : '', 'All statuses')}</select>
      <select id="m_min" onchange="renderMatches()">

        <option value="70">70+</option><option value="85">85+</option></select>
      <label class="check"><input type="checkbox" id="m_closed" onchange="loadMatches()" ${p.deals ? 'checked' : ''}> Show closed deals &amp; rejected</label>

async function loadMatches() {
  const p = S.params;
  const r = await call('getMatches', { buyerId: p.buyerId || '', vehicleId: p.vehicleId || '',
    minScore: 0, includeClosed: $('m_closed').checked });
  if (!r || S.view !== 'matches') return;
  S.matches = r.matches; registerMatches(r.matches);
  renderMatches();
}
function renderMatches() {
  const q = norm($('m_q').value), st = $('m_st').value, min = Number($('m_min').value);
  const list = S.matches.filter(m => m.score >= min && (!st || m.status === st) &&
    (!q || norm([m.matchId, m.buyer.buyer_id, m.buyer.name, m.buyer.phone, m.vehicle.vehicle_id,
      m.vehicle.owner_name, m.vehicle.owner_phone, m.vehicle.make, m.vehicle.model,
      m.buyer.officer && m.buyer.officer.name, m.vehicle.officer && m.vehicle.officer.name].join(' ')).includes(q)));
  $('list').innerHTML = list.map(matchCard).join('') || '<div class="empty">No matches</div>';
}
async function refreshAll(btn) {
  btn.disabled = true; toast('Matching…');
  const r = await call('refreshMatches');
  btn.disabled = false;
  if (r) { toast(`${r.added} new, ${r.updated} updated`); loadMatches(); }
}

function registerMatches(list) { list.forEach(m => S.mIndex[m.matchId] = m); }

async function saveMatch(id, btn) {
  const status = $('ms_' + id).value, notes = $('mn_' + id).value;
  if (isDealStatus(status) && !confirm('Mark this as a deal? The buyer will be set to Bought and the vehicle to Sold.')) return;
  btn.disabled = true;
  const r = await call('updateMatch', { matchId: id, status, notes });
  btn.disabled = false;
  if (!r) return;
  const m = S.mIndex[id]; if (m) Object.assign(m, { status, notes });
  toast(r.closed ? 'Deal saved! Buyer and vehicle closed' : 'Saved');
  if (r.closed) go(S.view, S.params);
}

async function addMaster(e) {
  e.preventDefault();
  const r = await call('addMaster', { vehicle_type: $('mm_t').value, make: $('mm_m').value, models: $('mm_models').value });
  if (!r) return;
  S.master = r.master;
  toast(r.added ? `Added ${r.added} item(s) to the list` : 'Already in the list');
  $('mm_models').value = '';
}
async function saveProfile(e) {
  e.preventDefault();
  const r = await call('updateProfile', { full_name: $('pf_n').value, phone: $('pf_p').value, email: $('pf_e').value });
  if (!r) return;
  S.user.full_name = r.full_name; S.user.phone = r.phone; S.user.email = r.email;
  $('unameText').textContent = r.full_name;
  toast('Profile saved');
}
async function testEmail(btn) {
  if (($('pf_e').value || '').trim().toLowerCase() !== (S.user.email || '')) { toast('Save your profile first', true); return; }
  btn.disabled = true;
  const r = await call('testEmail');
  btn.disabled = false;
  if (r) toast('Test email sent to ' + r.email);
}
async function changePw(e) {
  e.preventDefault();
  const r = await call('changePassword', { oldPassword: $('pw_old').value, newPassword: $('pw_new').value });
  if (r) { toast('Password changed'); e.target.reset(); }
}
async function addUser(e) {
  e.preventDefault();
  const r = await call('addUser', { username: $('nu_u').value, full_name: $('nu_n').value,
    password: $('nu_p').value, role: $('nu_r').value, phone: $('nu_ph').value, email: $('nu_e').value });
  if (r) { toast('User added'); e.target.reset(); loadUsers(); }
}

boot();
window.__vmStarted = true;
</script>
</body>
</html>
