<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VehicleHub — Vehicles for sale in Sri Lanka</title>
<meta name="description" content="Cars, SUVs, vans, bikes and more for sale in Sri Lanka. Every ad is checked by a VehicleHub agent. Post your vehicle free.">
<meta property="og:title" content="VehicleHub — Vehicles for sale in Sri Lanka">
<meta property="og:description" content="Every ad checked by a VehicleHub agent. Buy · Sell · Lease.">
<meta property="og:image" content="icon-512.png">
<meta name="theme-color" content="#1d3f8f">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<style>
  :root { --p:#1d3f8f; --p2:#2d5bd0; --ink:#172033; --mut:#5f6b7d; --bg:#f1f3f7; --line:#dde3ee; --card:#fff;
          --ok:#1b7a3d; --or:#f59e0b; --or2:#b86200; --soft:#eef3ff; --red:#d23c3c; --gold:#c98a00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: var(--p2); }
  button { font: inherit; }
  .ic { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  .muted { color: var(--mut); }
  .hide { display: none !important; }

  /* ---------- header ---------- */
  .top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  .top .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; }
  .top .logo { height: 48px; width: auto; display: block; }
  .hsearch { flex: 1; display: flex; max-width: 520px; margin: 0 8px; }
  .hsearch input { flex: 1; min-width: 0; border: 1px solid var(--line); border-right: 0; border-radius: 10px 0 0 10px; padding: 10px 12px; font: inherit; background: #f7f9fc; }
  .hsearch button { border: 0; border-radius: 0 10px 10px 0; background: var(--p); color: #fff; padding: 0 14px; cursor: pointer; }
  .hlinks { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .hlinks a.l { text-decoration: none; color: var(--mut); font-weight: 600; padding: 9px 12px; border-radius: 10px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .hlinks a.l.on { background: var(--soft); color: var(--p); }
  .hlinks a.l .n { background: var(--red); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; line-height: 18px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 16px;
         font-weight: 700; cursor: pointer; background: #e8edf6; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .btn.pri { background: var(--p); color: #fff; }
  .btn.or { background: var(--or); color: #1f1300; }
  .btn.wa { background: #1faa53; color: #fff; }
  .btn.ghost { background: #fff; border: 1px solid var(--line); }
  .btn.sm { padding: 7px 12px; font-size: 14px; }
  .btn.blk { width: 100%; }

  /* ---------- category strip ---------- */
  .cats { background: #fff; border-bottom: 1px solid var(--line); }
  .cats .wrap { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  .cats .wrap::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; padding: 8px 6px; background: #fff;
          border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--mut); }
  .chip .ic { width: 26px; height: 26px; }
  .chip small { font-weight: 500; }
  .chip.on { border-color: var(--p2); color: var(--p); background: var(--soft); }

  /* ---------- list page ---------- */
  .layout { display: grid; grid-template-columns: 270px 1fr; gap: 18px; padding: 16px 0 34px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; align-self: start; position: sticky; top: 80px; max-height: calc(100vh - 96px); overflow: auto; }
  .panel .ph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .panel h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .panel .x { display: none; border: 0; background: #eef1f6; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; align-items: center; justify-content: center; }
  .panel label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .panel input, .panel select, .bar select { width: 100%; font: inherit; font-size: 14px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .panel .acts { display: flex; gap: 8px; margin-top: 14px; position: sticky; bottom: -16px; background: #fff; padding: 8px 0 0; }
  .panel .acts .btn { flex: 1; }

  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar .count { font-weight: 700; }
  .bar .count span { color: var(--mut); font-weight: 400; }
  .bar .sp { flex: 1; }
  .bar select { width: auto; }
  .vt { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #fff; }
  .vt button { border: 0; background: #fff; padding: 7px 9px; cursor: pointer; color: var(--mut); display: flex; }
  .vt button.on { background: var(--soft); color: var(--p); }
  .fbtn { display: none; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 12px; }
  .tags button { border: 1px solid #c9d6f3; background: var(--soft); color: var(--p); border-radius: 99px; padding: 3px 10px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  .tags button .ic { width: 14px; height: 14px; }

  /* ad cards — list view (default, like riyasewana) */
  .ads { display: grid; gap: 10px; }
  .ad { position: relative; display: grid; grid-template-columns: 200px 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
        text-decoration: none; color: inherit; transition: box-shadow .15s; }
  .ad:hover { box-shadow: 0 8px 22px rgba(20,40,80,.10); }
  .ad.feat { border-color: #f2c85b; background: #fffdf5; }
  .th { position: relative; aspect-ratio: 4 / 3; background: #e6ebf3 center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: #9aa7ba; }
  .th > .ic { width: 46px; height: 46px; stroke-width: 1.3; }
  .th.loaded > .ic { display: none; }
  .badge { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; letter-spacing: .3px; color: #fff; background: var(--ok); }
  .badge.f { background: var(--gold); }
  .pc { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 1px 8px; border-radius: 99px; display: flex; gap: 4px; align-items: center; }
  .pc .ic { width: 13px; height: 13px; }
  .ad .b { padding: 10px 44px 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ad .t { font-weight: 700; font-size: 16.5px; line-height: 1.3; }
  .ad .pr { color: var(--p); font-weight: 800; font-size: 18px; }
  .ad .pr small { color: var(--mut); font-weight: 500; font-size: 12px; }
  .ad .m { color: var(--mut); font-size: 13.5px; }
  .ad .f { display: flex; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px; color: var(--mut); font-size: 12.5px; }
  .ad .f .ic { width: 14px; height: 14px; }
  .fav { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer;
         display: flex; align-items: center; justify-content: center; color: var(--mut); z-index: 2; }
  .fav .ic { width: 18px; height: 18px; }
  .fav.on { color: var(--red); }
  .fav.on .ic { fill: var(--red); }
  /* grid view */
  .ads.grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .ads.grid .ad { grid-template-columns: 1fr; }
  .ads.grid .ad .b { padding: 10px 12px 12px; }
  .ads.grid .fav { top: 8px; right: 8px; }

  .wcard { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--or); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .wcard .wt { display: inline-flex; align-self: flex-start; background: #fff3dc; color: var(--or2); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; letter-spacing: .4px; }
  .wcard .t { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .wcard .s { color: var(--mut); font-size: 13px; }
  .wcard .bud { font-weight: 700; }
  .wcard .btn { margin-top: 8px; }
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .notice { background: #fff8ec; border: 1px solid #f6d9a6; color: #7a4a00; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .notice .btn { margin-left: auto; }

  .pager { display: flex; gap: 6px; justify-content: center; margin: 22px 0 0; flex-wrap: wrap; }
  .pager button { min-width: 38px; height: 38px; border: 1px solid var(--line); background: #fff; border-radius: 9px; cursor: pointer; padding: 0 10px; }
  .pager button.on { background: var(--p); color: #fff; border-color: var(--p); }
  .pager button:disabled { opacity: .4; cursor: default; }
  .empty { text-align: center; color: var(--mut); padding: 40px 14px; background: #fff; border: 1px dashed var(--line); border-radius: 14px; }
  .sk { background: linear-gradient(90deg, #e9edf4 25%, #f4f6fa 50%, #e9edf4 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 12px; height: 150px; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* ---------- ad page ---------- */
  .crumb { font-size: 13px; color: var(--mut); padding: 14px 0 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .crumb a { text-decoration: none; }
  .adp { display: grid; grid-template-columns: 1fr 340px; gap: 18px; padding-bottom: 34px; align-items: start; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .box h2 { margin: 0 0 10px; font-size: 17px; display: flex; gap: 8px; align-items: center; }
  .adh { display: flex; gap: 10px; align-items: flex-start; }
  .adh h1 { margin: 0; font-size: 24px; line-height: 1.25; flex: 1; }
  .adh .fav { position: static; flex: none; width: 40px; height: 40px; }
  .adm { color: var(--mut); font-size: 13.5px; display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .adm .ic { width: 15px; height: 15px; }
  .gal { position: relative; background: #0f172a; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; color: #8a97ad; margin-top: 12px; user-select: none; }
  .gal img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .gal .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .gal .nav.l { left: 10px; } .gal .nav.r { right: 10px; }
  .gal .cnt { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 99px; }
  .gal .big { width: 64px; height: 64px; stroke-width: 1.2; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  .dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; background: #c6cfdd; padding: 0; cursor: pointer; }
  .dots button.on { background: var(--p); }
  .specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .spec { background: #f6f8fc; border-radius: 10px; padding: 9px 12px; }
  .spec span { display: block; color: var(--mut); font-size: 12px; }
  .spec b { font-size: 15px; }
  .desc { white-space: pre-wrap; margin: 0; }
  .side { position: sticky; top: 80px; }
  .pbox .pr { color: var(--p); font-size: 28px; font-weight: 800; line-height: 1.2; }
  .pbox .pr small { display: block; color: var(--mut); font-size: 14px; font-weight: 500; }
  .pbox .acts { display: grid; gap: 8px; margin-top: 14px; }
  .pbox .note { font-size: 12.5px; color: var(--mut); display: flex; gap: 6px; margin-top: 12px; }
  .pbox .note .ic { width: 16px; height: 16px; margin-top: 2px; }
  .lc label { display: block; font-size: 13px; font-weight: 600; margin: 8px 0 4px; }
  .lc input, .lc select { width: 100%; font: inherit; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  .lc .res { background: var(--soft); border-radius: 12px; padding: 12px; margin-top: 12px; }
  .lc .res .mo { font-size: 24px; font-weight: 800; color: var(--p); }
  .lc .res .row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--mut); }
  .tips { margin: 0; padding-left: 18px; color: var(--mut); font-size: 14px; }
  .tips li { margin: 3px 0; }
  .cbar { display: none; }
  .mprice { display: none; color: var(--p); font-size: 22px; font-weight: 800; margin-top: 6px; }
  .mprice small { color: var(--mut); font-size: 13px; font-weight: 500; }

  footer { border-top: 1px solid var(--line); background: #fff; }
  footer .wrap { padding: 20px 16px; display: flex; gap: 12px 18px; align-items: center; flex-wrap: wrap; color: var(--mut); font-size: 13.5px; }
  footer .links { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }
  footer a { text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }

  @media (max-width: 920px) {
    .hsearch { display: none; }
    .msearch { display: flex !important; }
    .hlinks a.l span.tx { display: none; }
    .layout, .adp { grid-template-columns: 1fr; }
    .side { position: static; }
    .panel { display: none; position: fixed; inset: 0; z-index: 60; border-radius: 0; max-height: none; top: 0; align-self: stretch; height: 100%; }
    .panel.open { display: block; }
    .panel .x { display: inline-flex; }
    .fbtn { display: inline-flex; }
    .top .logo { height: 40px; }
    .cbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff;
            border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
    body.has-cbar { padding-bottom: 70px; }
    .mprice { display: block; }
  }
  @media (max-width: 560px) {
    .ad { grid-template-columns: 130px 1fr; }
    .ad .th { aspect-ratio: auto; min-height: 112px; height: 100%; }
    .ad .b { padding: 8px 38px 8px 10px; }
    .ad .t { font-size: 15px; }
    .ad .pr { font-size: 16px; }
    .ad .pr small { display: none; }
    .ad .m { font-size: 12.5px; }
    .fav { width: 30px; height: 30px; }
    .ads.grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .ads.grid .ad .th { aspect-ratio: 4 / 3; min-height: 0; }
    .adh h1 { font-size: 20px; }
    .specs { grid-template-columns: 1fr 1fr; }
    .btn.or .tx { display: none; }
    .bar .count span { display: none; }
  }
  .msearch { display: none; padding: 0 16px 10px; }
  .msearch form { display: flex; flex: 1; }
</style>
</head>

  function pager(page, pages) {
    if (pages < 2) return '';
    var b = [], lo = Math.max(1, page - 2), hi = Math.min(pages, page + 2);
    b.push('<button type="button" data-p="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + ' aria-label="Previous">' + ic('left') + '</button>');
    if (lo > 1) b.push('<button type="button" data-p="1">1</button>' + (lo > 2 ? '<button type="button" disabled>…</button>' : ''));
    for (var i = lo; i <= hi; i++) b.push('<button type="button" data-p="' + i + '" class="' + (i === page ? 'on' : '') + '">' + i + '</button>');
    if (hi < pages) b.push((hi < pages - 1 ? '<button type="button" disabled>…</button>' : '') + '<button type="button" data-p="' + pages + '">' + pages + '</button>');
    b.push('<button type="button" data-p="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + ' aria-label="Next">' + ic('right') + '</button>');
    return '<div class="pager">' + b.join('') + '</div>';
  }

  async function loadThumbs(ids) {
    ids.forEach(function (id) { if (!S.thumbs[id]) { var c = sstored('vh_th_' + id); if (c) S.thumbs[id] = c; } if (S.thumbs[id]) setThumbEls(id, S.thumbs[id]); });
    ids = ids.filter(function (id) { return !S.thumbs[id] && !S.loading[id]; });
    for (var i = 0; i < ids.length; i += 24) {
      var part = ids.slice(i, i + 24);
      part.forEach(function (id) { S.loading[id] = 1; });
      try {
        var r = await call('publicThumbs', [part]);
        Object.keys(r || {}).forEach(function (id) { S.thumbs[id] = r[id]; sstore('vh_th_' + id, r[id]); setThumbEls(id, r[id]); });
      } catch (e) { /* placeholders stay */ }
      part.forEach(function (id) { delete S.loading[id]; });
    }
  }

  async function loadGallery(id) {
    G.id = id; G.i = 0; G.ids = [];
    try { G.ids = await call('publicPhotos', [id]); } catch (e) { G.ids = []; }
    if (G.id !== id) return;
    galShow();
    var gal = $('gal'), x0 = null;
    if (!gal) return;
    gal.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    gal.addEventListener('touchend', function (e) {
      if (x0 == null || G.ids.length < 2) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) galMove(dx < 0 ? 1 : -1);
    });
  }
  function galMove(d) { G.i = (G.i + d + G.ids.length) % G.ids.length; galShow(); }
  async function galShow() {
    var gal = $('gal'); if (!gal) return;
    var id = G.id;
    if (!G.ids.length) { gal.innerHTML = '<span>No photos</span>'; return; }
    var fid = G.ids[G.i];
    $('dots').innerHTML = G.ids.length > 1 ? G.ids.map(function (_, i) { return '<button type="button" class="' + (i === G.i ? 'on' : '') + '" data-g="' + i + '" aria-label="Photo ' + (i + 1) + '"></button>'; }).join('') : '';
    $('dots').querySelectorAll('button').forEach(function (b) { b.onclick = function () { G.i = +b.dataset.g; galShow(); }; });
    if (!G.cache[fid]) gal.innerHTML = '<span>Loading photo ' + (G.i + 1) + '…</span>';
    try { if (!G.cache[fid]) G.cache[fid] = await call('publicPhoto', [id, fid]); }
    catch (e) { if ($('gal')) $('gal').innerHTML = '<span>Photo could not be loaded</span>'; return; }
    if (!$('gal') || G.id !== id || G.ids[G.i] !== fid) return;
    gal.innerHTML = '<img src="' + G.cache[fid] + '" alt="Photo ' + (G.i + 1) + '">' +
      (G.ids.length > 1 ? '<button class="nav l" type="button" aria-label="Previous">' + ic('left') + '</button><button class="nav r" type="button" aria-label="Next">' + ic('right') + '</button>' : '') +
      '<span class="cnt">' + (G.i + 1) + ' / ' + G.ids.length + '</span>';
    var l = gal.querySelector('.l'), r = gal.querySelector('.r');
    if (l) l.onclick = function () { galMove(-1); };
    if (r) r.onclick = function () { galMove(1); };
    var nx = G.ids[(G.i + 1) % G.ids.length];
    if (nx && !G.cache[nx]) call('publicPhoto', [id, nx]).then(function (d) { G.cache[nx] = d; }).catch(function () {});
  }

  // ---------- leasing calculator (flat rate, an estimate only) ----------
  function leasingBox(v) {
    if (v.price === '' || !v.price) return '';
    var years = [1, 2, 3, 4, 5, 6, 7];
    return '<div class="box lc"><h2>' + ic('calc') + ' Leasing calculator</h2>' +
      '<div class="two"><div><label for="lc_price">Vehicle price (Lakhs)</label><input id="lc_price" type="number" inputmode="decimal" min="0" step="0.5" value="' + esc(v.price) + '"></div>' +
      '<div><label for="lc_down">Down payment (Lakhs)</label><input id="lc_down" type="number" inputmode="decimal" min="0" step="0.5" value="' + (Math.round(v.price * 0.4 * 2) / 2) + '"></div></div>' +
      '<div class="two"><div><label for="lc_years">Period</label><select id="lc_years">' + years.map(function (y) { return '<option value="' + y + '"' + (y === 5 ? ' selected' : '') + '>' + y + ' year' + (y > 1 ? 's' : '') + '</option>'; }).join('') + '</select></div>' +
      '<div><label for="lc_rate">Interest (% per year, flat)</label><input id="lc_rate" type="number" inputmode="decimal" min="0" max="60" step="0.25" value="13"></div></div>' +
      '<div class="res" id="lc_res"></div>' +
      '<p class="muted" style="font-size:12.5px;margin:10px 0 0">This is an estimate only. Rates and the amount you can borrow differ between leasing companies — ask our agent for a real quote.</p></div>';
  }
  function bindLeasing(v) {
    if (!$('lc_res')) return;
    var c = S.data.contact || {}, num = waNum(c.phone);
    function calc() {
      var price = Number($('lc_price').value) || 0, down = Math.min(Number($('lc_down').value) || 0, price);
      var yrs = Number($('lc_years').value) || 5, rate = Number($('lc_rate').value) || 0;
      var loan = (price - down) * 100000, total = loan * (1 + rate / 100 * yrs), mo = yrs ? total / (yrs * 12) : 0;
      var ask = 'Hi VehicleHub, I would like a leasing quote for ' + title(v) + ' (Ref ' + v.id + '). Price ' + rs(price) + ', down payment ' + rs(down) + ', ' + yrs + ' years.';
      $('lc_res').innerHTML = '<div class="row"><span>Monthly payment</span></div><div class="mo">' + rsN(mo) + '</div>' +
        '<div class="row"><span>Loan amount</span><b>' + rsN(loan) + '</b></div>' +
        '<div class="row"><span>Total interest</span><b>' + rsN(total - loan) + '</b></div>' +
        '<div class="row"><span>Total you pay back</span><b>' + rsN(total) + '</b></div>' +
        (num ? '<a class="btn wa sm" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/' + num + '?text=' + encodeURIComponent(ask) + '">' + ic('chat') + ' Ask for a leasing quote</a>' : '');
    }
    ['lc_price', 'lc_down', 'lc_years', 'lc_rate'].forEach(function (id) { $(id).oninput = calc; $(id).onchange = calc; });
    calc();
  }

  function similarBox(v) {
    var list = S.data.vehicles.filter(function (x) { return x.id !== v.id && x.type === v.type; }).map(function (x) {
      var s = (x.make === v.make ? 4 : 0) + (x.model === v.model ? 4 : 0);
      if (v.price !== '' && x.price !== '') s += Math.max(0, 3 - Math.abs(x.price - v.price) / Math.max(v.price, 1) * 6);
      if (v.year && x.year) s += Math.max(0, 2 - Math.abs(x.year - v.year) / 2);
      return { x: x, s: s };
    }).sort(function (a, b) { return b.s - a.s; }).slice(0, 4).map(function (o) { return o.x; });
    if (!list.length) return '';
    return '<div class="box"><h2>' + ic('car') + ' Similar vehicles</h2><div class="ads grid">' + list.map(adCard).join('') + '</div></div>';
  }

  // ---------- start: show the last copy at once, then refresh from the server ----------
  function applyData(d) {
    S.data = d;
    var c = d.contact || {};
    if (c.facebook) $('fFb').href = c.facebook;
    if (c.phone) { $('fPhone').href = 'tel:' + c.phone; $('fPhone').innerHTML = ic('phone') + ' ' + esc(c.phone); }

  async function load() {
    var cached = null;
    try { cached = JSON.parse(stored('vh_data') || 'null'); } catch (e) {}
    if (cached && cached.d && Date.now() - cached.t < 24 * 3600 * 1000) applyData(cached.d);
    else $('view').innerHTML = '<div class="layout"><div></div><div class="ads">' + '<div class="sk"></div>'.repeat(5) + '</div></div>';
    try {
      var d = await call('publicListings', []);
      var fresh = JSON.stringify(d);
      store('vh_data', JSON.stringify({ t: Date.now(), d: d }));
      if (cached && JSON.stringify(cached.d) === fresh) return;          // nothing changed — keep the page as it is
      var r = route();
      if (cached && r.page === 'ad' && d.vehicles.some(function (x) { return x.id === r.id; })) { S.data = d; navCounts(); return; }
      var keep = window.scrollY;
      applyData(d);
      if (cached) window.scrollTo(0, keep);
    } catch (e) {
      if (cached) return;
      $('view').innerHTML = '<div style="padding:30px 0"><div class="empty">Could not load vehicles. ' + esc(e.message) +
        '<br><br><button class="btn pri" type="button" id="retry">' + ic('refresh') + ' Try again</button></div></div>';
      $('retry').onclick = load;
    }
  }
  navCounts();
  load();
})();
</script>
</body>
</html>
