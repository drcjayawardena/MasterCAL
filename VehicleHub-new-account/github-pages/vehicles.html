<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VehicleHub — Vehicles for sale &amp; wanted</title>
<meta name="description" content="Browse vehicles for sale checked by VehicleHub agents, or see what buyers are looking for.">
<meta name="theme-color" content="#1d3f8f">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>
  :root { --p:#1d3f8f; --p2:#2d5bd0; --ink:#172033; --mut:#5f6b7d; --bg:#f3f5f9; --line:#dde3ee; --card:#fff;
          --ok:#1b7a3d; --or:#b86200; --soft:#eef3ff; --red:#c0392b; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: var(--p2); }
  .ic { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  /* top bar */
  .top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .top .wrap { display: flex; align-items: center; gap: 14px; min-height: 68px; flex-wrap: wrap; }
  .top .logo { height: 52px; width: auto; display: block; }
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tabs a { text-decoration: none; color: var(--mut); font-weight: 600; padding: 10px 14px; border-radius: 10px; display: inline-flex; gap: 8px; align-items: center; }
  .tabs a.on { background: var(--soft); color: var(--p); }
  .top .sell { margin-left: auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 16px;
         font: inherit; font-weight: 700; cursor: pointer; background: #e8edf6; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .btn.pri { background: var(--p); color: #fff; }
  .btn.or { background: #f59e0b; color: #1f1300; }
  .btn.wa { background: #1faa53; color: #fff; }
  .btn.ghost { background: #fff; border: 1px solid var(--line); }
  .btn.sm { padding: 7px 12px; font-size: 14px; }

  /* hero */
  .hero { background: linear-gradient(120deg, #13306f, #2d5bd0); color: #fff; }
  .hero .wrap { padding-top: 22px; padding-bottom: 22px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .hero h1 { margin: 0; font-size: 24px; line-height: 1.25; }
  .hero p { margin: 4px 0 0; opacity: .85; }
  .hero .search { margin-left: auto; display: flex; gap: 8px; flex: 1 1 320px; max-width: 460px; }
  .hero .search input { flex: 1; border: 0; border-radius: 10px; padding: 12px 14px; font: inherit; }

  /* type chips */
  .types { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: none; }
  .types::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; min-width: 88px; padding: 10px 8px; background: #fff;
          border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; color: var(--mut); }
  .chip .ic { width: 26px; height: 26px; }
  .chip.on { border-color: var(--p2); color: var(--p); background: var(--soft); }

  /* layout */
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 18px; padding: 12px 0 30px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; align-self: start; position: sticky; top: 84px; }
  .panel h3 { margin: 0 0 10px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .panel label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .panel input, .panel select, .bar select { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .panel .acts { display: flex; gap: 8px; margin-top: 14px; }
  .panel .acts .btn { flex: 1; }
  .fbtn { display: none; }

  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar .count { font-weight: 700; }
  .bar .count span { color: var(--mut); font-weight: 400; }
  .bar select { width: auto; margin-left: auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
          transition: box-shadow .15s, transform .15s; }
  .card:hover { box-shadow: 0 10px 24px rgba(20,40,80,.10); transform: translateY(-2px); }
  .thumb { position: relative; aspect-ratio: 4 / 3; background: #e6ebf3 center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: #9aa7ba; }
  .thumb .ic { width: 48px; height: 48px; stroke-width: 1.4; }
  .thumb.loaded .ic { display: none; }
  .thumb .tag { position: absolute; left: 8px; top: 8px; background: var(--ok); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; letter-spacing: .3px; }
  .thumb .pc { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 99px; display: flex; gap: 4px; align-items: center; }
  .thumb .pc .ic { width: 14px; height: 14px; display: inline; }
  .card .b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .card .t { font-weight: 700; font-size: 16px; }
  .card .s { color: var(--mut); font-size: 13px; }
  .card .pr { color: var(--p); font-weight: 800; font-size: 18px; margin-top: 6px; }
  .card .pr small { color: var(--mut); font-weight: 500; font-size: 12px; }
  .card .f { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; color: var(--mut); font-size: 12px; }

  .wcard { background: #fff; border: 1px solid var(--line); border-left: 4px solid #f59e0b; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .wcard .wt { display: inline-flex; align-self: flex-start; background: #fff3dc; color: var(--or); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; letter-spacing: .4px; }
  .wcard .t { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .wcard .s { color: var(--mut); font-size: 13px; }
  .wcard .bud { font-weight: 700; color: var(--ink); }
  .wcard .btn { margin-top: 8px; }
  .notice { background: #fff8ec; border: 1px solid #f6d9a6; color: #7a4a00; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .notice .btn { margin-left: auto; }

  .pager { display: flex; gap: 6px; justify-content: center; margin: 20px 0 0; flex-wrap: wrap; }
  .pager button { min-width: 38px; height: 38px; border: 1px solid var(--line); background: #fff; border-radius: 9px; cursor: pointer; font: inherit; }
  .pager button.on { background: var(--p); color: #fff; border-color: var(--p); }
  .empty { text-align: center; color: var(--mut); padding: 40px 10px; background: #fff; border: 1px dashed var(--line); border-radius: 14px; grid-column: 1 / -1; }
  .sk { background: linear-gradient(90deg, #e9edf4 25%, #f4f6fa 50%, #e9edf4 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 14px; height: 290px; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* detail modal */
  .modal { position: fixed; inset: 0; background: rgba(10,16,30,.7); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .dlg { background: #fff; border-radius: 16px; width: 100%; max-width: 900px; max-height: 94vh; overflow: auto; display: grid; grid-template-columns: 1.3fr 1fr; }
  .gal { position: relative; background: #0f172a; min-height: 300px; display: flex; align-items: center; justify-content: center; color: #8a97ad; }
  .gal img { width: 100%; height: 100%; max-height: 70vh; object-fit: contain; display: block; }
  .gal .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .gal .nav.l { left: 10px; } .gal .nav.r { right: 10px; }
  .gal .cnt { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 99px; }
  .info { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .info .x { align-self: flex-end; border: 0; background: #eef1f6; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .info h2 { margin: 0; font-size: 22px; }
  .info .pr { color: var(--p); font-size: 26px; font-weight: 800; }
  .info .pr small { color: var(--mut); font-size: 14px; font-weight: 500; }
  .specs { width: 100%; border-collapse: collapse; font-size: 14px; }
  .specs td { padding: 7px 0; border-bottom: 1px solid #eef1f6; }
  .specs td:first-child { color: var(--mut); width: 45%; }
  .info .acts { display: grid; gap: 8px; margin-top: 4px; }
  .info .note { font-size: 12px; color: var(--mut); display: flex; gap: 6px; }
  .info .note .ic { width: 16px; height: 16px; }

  footer { border-top: 1px solid var(--line); background: #fff; }
  footer .wrap { padding: 18px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--mut); font-size: 13px; }
  footer .links { margin-left: auto; display: flex; gap: 14px; }
  footer a { text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .panel { display: none; position: static; }
    .panel.open { display: block; }
    .fbtn { display: inline-flex; }
    .dlg { grid-template-columns: 1fr; }
    .gal { min-height: 240px; }
    .top .logo { height: 42px; }
    .tabs { order: 3; width: 100%; margin: 0 0 8px; }
    .tabs a { flex: 1; justify-content: center; }
    .hero h1 { font-size: 20px; }
  }
</style>
</head>

(function () {

  var API = window.VM_API_URL || '';
  var PER_PAGE = 12;
  var $ = function (id) { return document.getElementById(id); };

  var ICONS = {

    all: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',

    filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    left: '<polyline points="15 18 9 12 15 6"/>', right: '<polyline points="9 18 15 12 9 6"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    refresh: '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'
  };
  function ic(n) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || ICONS.car) + '</svg>'; }
  var TYPE_ICON = { 'Car': 'car', 'SUV / Jeep': 'suv', 'Van': 'van', 'Cab / Pickup': 'pickup', 'Motorcycle': 'bike', 'Three Wheeler': 'tuk', 'Lorry': 'lorry', 'Bus': 'bus' };
  function typeIcon(t) { return TYPE_ICON[t] || 'car'; }

  var S = { data: null, mode: 'sale', type: '', page: 1, thumbs: {}, loading: {} };

  // ---------- static labels ----------
  $('t_sale').innerHTML = ic('car') + ' Vehicles for sale';
  $('t_want').innerHTML = ic('search') + ' Wanted';
  $('sellBtn').innerHTML = ic('tag') + ' Sell your vehicle';
  $('qbtn').innerHTML = ic('search') + ' Search';
  $('fTitle').innerHTML = ic('filter') + ' Filters';
  $('fToggle').innerHTML = ic('filter') + ' Filters';
  $('fBuy').innerHTML = ic('search') + ' Tell us what you want';
  $('fSell').innerHTML = ic('tag') + ' Sell your vehicle';
  $('fFb').innerHTML = ic('facebook') + ' Facebook';
  $('fToggle').onclick = function () { $('panel').classList.toggle('open'); };

  // ---------- API ----------
  async function call(fn, args) {
    if (!API || API.indexOf('PASTE_') === 0) throw new Error('This page is not set up yet.');
    var res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args || [] }), redirect: 'follow' });
    var j = await res.json();
    if (!j || !j.ok) throw new Error((j && j.error) || 'Error');
    return j.result;
  }

  // ---------- helpers ----------
  function rs(lakhs) {
    if (lakhs === '' || lakhs == null) return 'Price on request';
    return 'Rs. ' + Math.round(Number(lakhs) * 100000).toLocaleString('en-US');
  }
  function lk(n) { return (n === '' || n == null) ? '' : Number(n).toLocaleString('en-US') + ' Lakhs'; }
  function ago(d) {
    if (!d) return '';
    var days = Math.floor((Date.now() - new Date(d + 'T00:00:00').getTime()) / 86400000);
    return days <= 0 ? 'Today' : days === 1 ? 'Yesterday' : days < 30 ? days + ' days ago' : Math.floor(days / 30) + ' mo ago';
  }
  function isNew(d) { return d && (Date.now() - new Date(d + 'T00:00:00').getTime()) < 4 * 86400000; }
  function carName(x) { return [x.make, x.model].filter(Boolean).join(' ') || x.type || 'Vehicle'; }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

  // ---------- routing ----------
  function fromHash() {
    var h = location.hash.replace('#', '');
    if (h.indexOf('v=') === 0) { S.mode = 'sale'; openDetail(h.slice(2)); }
    else S.mode = (h === 'wanted') ? 'want' : 'sale';
    S.page = 1; render();
  }
  window.addEventListener('hashchange', function () { if (location.hash.indexOf('#v=') !== 0) fromHash(); });
  $('t_sale').onclick = function (e) { e.preventDefault(); history.pushState(null, '', 'vehicles.html'); S.mode = 'sale'; S.page = 1; render(); };

  // ---------- filters ----------
  function readF() {
    return { make: $('f_make').value, model: norm($('f_model').value), ymin: Number($('f_ymin').value) || 0, ymax: Number($('f_ymax').value) || 0,
             pmin: Number($('f_pmin').value) || 0, pmax: Number($('f_pmax').value) || 0, cond: $('f_cond').value, q: norm($('q').value) };
  }
  ['f_make', 'f_cond', 'sort'].forEach(function (id) { $(id).onchange = function () { S.page = 1; render(); }; });
  $('f_apply').onclick = function () { S.page = 1; render(); $('panel').classList.remove('open'); };
  $('f_clear').onclick = function () { ['f_make', 'f_model', 'f_ymin', 'f_ymax', 'f_pmin', 'f_pmax', 'f_cond'].forEach(function (id) { $(id).value = ''; }); $('q').value = ''; S.type = ''; S.page = 1; render(); };
  $('qform').onsubmit = function (e) { e.preventDefault(); S.page = 1; render(); };

  function fillFilterLists() {
    var d = S.data, makes = {}, conds = {};
    d.vehicles.concat(d.wanted).forEach(function (x) { if (x.make) makes[x.make] = 1; });
    d.vehicles.forEach(function (x) { if (x.condition) conds[x.condition] = 1; });
    $('f_make').innerHTML = '<option value="">Any make</option>' + Object.keys(makes).sort().map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('');
    $('f_cond').innerHTML = '<option value="">Any</option>' + Object.keys(conds).sort().map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('');
  }

  function renderTypes() {
    var list = S.mode === 'sale' ? S.data.vehicles : S.data.wanted, counts = {};
    list.forEach(function (x) { counts[x.type] = (counts[x.type] || 0) + 1; });
    var types = [''].concat(S.data.types || Object.keys(TYPE_ICON));
    $('types').innerHTML = types.map(function (t) {
      var n = t ? (counts[t] || 0) : list.length;
      return '<button type="button" class="chip' + (S.type === t ? ' on' : '') + '" data-t="' + esc(t) + '">' + ic(t ? typeIcon(t) : 'all') +
        '<span>' + esc(t || 'All') + ' <small>(' + n + ')</small></span></button>';
    }).join('');
    $('types').querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { S.type = b.dataset.t; S.page = 1; render(); }; });
  }

  function sortOptions() {
    var cur = $('sort').value;
    var o = S.mode === 'sale'
      ? [['new', 'Newest first'], ['plow', 'Price: low to high'], ['phigh', 'Price: high to low'], ['ynew', 'Year: newest'], ['yold', 'Year: oldest']]
      : [['new', 'Newest first'], ['blow', 'Budget: low to high'], ['bhigh', 'Budget: high to low']];
    $('sort').innerHTML = o.map(function (x) { return '<option value="' + x[0] + '">' + x[1] + '</option>'; }).join('');
    if (o.some(function (x) { return x[0] === cur; })) $('sort').value = cur;
  }

  // ---------- main render ----------
  function render() {
    if (!S.data) return;
    var sale = S.mode === 'sale';
    $('t_sale').classList.toggle('on', sale); $('t_want').classList.toggle('on', !sale);
    $('heroT').textContent = sale ? 'Find your next vehicle' : 'Buyers are looking for these vehicles';
    $('heroS').textContent = sale ? 'Every vehicle is checked by a VehicleHub agent. Enquire and we will call you.'
                                  : 'Have one of these? Tell us — we already have a buyer waiting.';
    $('yearBox').style.display = ''; $('condBox').style.display = sale ? '' : 'none';
    $('priceL').textContent = sale ? 'Price (Lakhs)' : 'Budget (Lakhs)';
    sortOptions(); renderTypes();
    $('wantNote').innerHTML = sale ? '' : '<div class="notice">' + ic('tag') + '<span>Names and phone numbers of buyers are kept private. Tap <b>I have this vehicle</b> and our agent will contact you.</span>' +
      '<a class="btn or sm" href="request.html?type=seller&src=wanted">' + ic('plus') + ' Sell a different vehicle</a></div>';

    var f = readF(), list = (sale ? S.data.vehicles : S.data.wanted).filter(function (x) {
      if (S.type && x.type !== S.type) return false;
      if (f.make && x.make !== f.make) return false;
      if (f.model && norm(x.model).indexOf(f.model) === -1) return false;
      if (f.q && norm(x.make + x.model + x.type).indexOf(f.q) === -1) return false;
      if (sale) {
        if (f.cond && x.condition !== f.cond) return false;
        if (f.ymin && (!x.year || x.year < f.ymin)) return false;
        if (f.ymax && (!x.year || x.year > f.ymax)) return false;
        if (f.pmin && (x.price === '' || x.price < f.pmin)) return false;
        if (f.pmax && (x.price === '' || x.price > f.pmax)) return false;
      } else {
        if (f.ymin && x.year_to && x.year_to < f.ymin) return false;
        if (f.ymax && x.year_from && x.year_from > f.ymax) return false;
        if (f.pmin && x.max_budget !== '' && x.max_budget < f.pmin) return false;
        if (f.pmax && x.min_budget !== '' && x.min_budget > f.pmax) return false;
      }
      return true;
    });
    var s = $('sort').value, num = function (v, d) { return v === '' || v == null ? d : v; };
    list.sort(function (a, b) {
      if (s === 'plow') return num(a.price, 1e9) - num(b.price, 1e9);
      if (s === 'phigh') return num(b.price, -1) - num(a.price, -1);
      if (s === 'ynew') return num(b.year, 0) - num(a.year, 0);
      if (s === 'yold') return num(a.year, 9999) - num(b.year, 9999);
      if (s === 'blow') return num(a.max_budget, 1e9) - num(b.max_budget, 1e9);
      if (s === 'bhigh') return num(b.max_budget, -1) - num(a.max_budget, -1);
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });

    var pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    if (S.page > pages) S.page = pages;
    var from = (S.page - 1) * PER_PAGE, show = list.slice(from, from + PER_PAGE);
    $('count').innerHTML = list.length + (sale ? ' vehicle' : ' wanted request') + (list.length === 1 ? '' : 's') +
      (list.length ? ' <span>· showing ' + (from + 1) + '–' + (from + show.length) + '</span>' : '');
    $('grid').innerHTML = show.map(sale ? saleCard : wantCard).join('') ||
      '<div class="empty">' + (sale ? 'No vehicles match your search.' : 'No wanted requests match your search.') +
      '<br><br><a class="btn pri" href="request.html?type=' + (sale ? 'buyer' : 'seller') + '&src=showroom">' + ic(sale ? 'search' : 'tag') + ' ' +
      (sale ? 'Tell us what you want — we will find it' : 'Sell your vehicle') + '</a></div>';
    $('pager').innerHTML = pages < 2 ? '' : Array.apply(null, Array(pages)).map(function (_, i) {
      return '<button type="button" class="' + (i + 1 === S.page ? 'on' : '') + '" data-p="' + (i + 1) + '">' + (i + 1) + '</button>';
    }).join('');
    $('pager').querySelectorAll('button').forEach(function (b) { b.onclick = function () { S.page = +b.dataset.p; render(); window.scrollTo({ top: 0 }); }; });
    if (sale) {
      $('grid').querySelectorAll('.card').forEach(function (c) { c.onclick = function () { openDetail(c.dataset.id); }; });
      loadThumbs(show.filter(function (x) { return x.photos; }).map(function (x) { return x.id; }));
    }
  }

  function saleCard(v) {
    var th = S.thumbs[v.id];
    return '<div class="card" data-id="' + esc(v.id) + '" tabindex="0" role="button" aria-label="' + esc(carName(v)) + '">' +
      '<div class="thumb' + (th ? ' loaded' : '') + '" id="th_' + esc(v.id) + '"' + (th ? ' style="background-image:url(\'' + th + '\')"' : '') + '>' + ic(typeIcon(v.type)) +
      (isNew(v.date) ? '<span class="tag">NEW</span>' : '') +
      (v.photos ? '<span class="pc">' + ic('camera') + v.photos + '</span>' : '') + '</div>' +
      '<div class="b"><div class="t">' + esc(carName(v)) + '</div>' +
      '<div class="s">' + esc([v.year, v.condition, v.color].filter(Boolean).join(' · ') || v.type) + '</div>' +
      '<div class="pr">' + esc(rs(v.price)) + (v.price !== '' ? ' <small>(' + esc(lk(v.price)) + ')</small>' : '') + '</div>' +
      '<div class="f"><span>' + esc(v.type) + '</span><span>' + esc(ago(v.date)) + '</span></div></div></div>';
  }

  function wantCard(w) {
    var yrs = w.year_from || w.year_to ? (w.year_from || '…') + ' – ' + (w.year_to || '…') : 'Any year';
    var bud = w.min_budget !== '' ? 'Rs. ' + lk(w.min_budget).replace(' Lakhs', '') + ' – ' + lk(w.max_budget) : 'Up to Rs. ' + lk(w.max_budget);
    var link = 'request.html?type=seller&src=wanted&about=' + encodeURIComponent(w.id) + '&make=' + encodeURIComponent(w.make) +
      '&model=' + encodeURIComponent(w.model) + '&vtype=' + encodeURIComponent(w.type);
    return '<div class="wcard"><span class="wt">WANTED</span>' +
      '<div class="t">' + ic(typeIcon(w.type)) + esc(carName(w)) + '</div>' +
      '<div class="s">' + esc(w.type || 'Any type') + ' · ' + esc(yrs) + '</div>' +
      '<div class="bud">Budget: ' + esc(bud) + '</div>' +
      '<div class="s">Posted ' + esc(ago(w.date).toLowerCase()) + ' · Ref ' + esc(w.id) + '</div>' +
      '<a class="btn pri" href="' + link + '">' + ic('tag') + ' I have this vehicle</a></div>';
  }

  // ---------- thumbnails (lazy, in batches) ----------
  async function loadThumbs(ids) {
    ids = ids.filter(function (id) { return !S.thumbs[id] && !S.loading[id]; });
    if (!ids.length) return;
    ids.forEach(function (id) { S.loading[id] = 1; });
    try {
      var r = await call('publicThumbs', [ids]);
      Object.keys(r || {}).forEach(function (id) {
        S.thumbs[id] = r[id];
        var el = $('th_' + id); if (el) { el.style.backgroundImage = "url('" + r[id] + "')"; el.classList.add('loaded'); }
      });
    } catch (e) { /* placeholders stay */ }
  }

  // ---------- vehicle detail ----------
  var G = { id: '', ids: [], i: 0, cache: {} };
  async function openDetail(id) {
    var v = S.data && S.data.vehicles.find(function (x) { return x.id === id; });
    if (!v) { if (S.data) alert('This vehicle is no longer available.'); return; }
    history.replaceState(null, '', '#v=' + id);
    var c = S.data.contact || {}, title = carName(v) + (v.year ? ' ' + v.year : '');
    var enquire = 'request.html?type=buyer&src=showroom&about=' + encodeURIComponent(v.id) + '&make=' + encodeURIComponent(v.make) +
      '&model=' + encodeURIComponent(v.model) + '&vtype=' + encodeURIComponent(v.type) + '&year=' + encodeURIComponent(v.year) + '&price=' + encodeURIComponent(v.price);
    var msg = 'Hi VehicleHub, I am interested in ' + title + ' (' + rs(v.price) + ') — Ref ' + v.id + '. ' + location.href.split('#')[0] + '#v=' + v.id;
    var num = c.phone ? '94' + String(c.phone).replace(/^0/, '') : '';
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="dlg" role="dialog" aria-label="' + esc(title) + '">' +
      '<div class="gal" id="gal">' + (v.photos ? '<div>Loading photos…</div>' : ic(typeIcon(v.type))) + '</div>' +
      '<div class="info"><button class="x" type="button" aria-label="Close">' + ic('x') + '</button>' +
      '<h2>' + esc(title) + '</h2>' +
      '<div class="pr">' + esc(rs(v.price)) + (v.price !== '' ? ' <small>(' + esc(lk(v.price)) + ')</small>' : '') + '</div>' +
      '<table class="specs">' +
        '<tr><td>Type</td><td>' + esc(v.type || '-') + '</td></tr>' +
        '<tr><td>Make</td><td>' + esc(v.make || '-') + '</td></tr>' +
        '<tr><td>Model</td><td>' + esc(v.model || '-') + '</td></tr>' +
        '<tr><td>Year</td><td>' + esc(v.year || '-') + '</td></tr>' +
        '<tr><td>Condition</td><td>' + esc(v.condition || '-') + '</td></tr>' +
        (v.color ? '<tr><td>Colour</td><td>' + esc(v.color) + '</td></tr>' : '') +
        '<tr><td>Listed</td><td>' + esc(ago(v.date)) + '</td></tr>' +
        '<tr><td>Reference</td><td>' + esc(v.id) + '</td></tr>' +
      '</table>' +
      '<div class="acts">' +
        '<a class="btn pri" href="' + enquire + '">' + ic('send') + ' Enquire now</a>' +
        (num ? '<a class="btn wa" target="_blank" rel="noopener" href="https:/' + '/wa.me/' + num + '?text=' + encodeURIComponent(msg) + '">' + ic('chat') + ' WhatsApp VehicleHub</a>' +
               '<a class="btn ghost" href="tel:' + esc(c.phone) + '">' + ic('phone') + ' Call ' + esc(c.phone) + '</a>' : '') +
        '<button class="btn ghost" type="button" id="shareBtn">' + ic('share') + ' Share this vehicle</button>' +
      '</div>' +
      '<div class="note">' + ic('shield') + '<span>You deal through a VehicleHub agent. Number plates are hidden in photos for the owner\'s privacy.</span></div>' +
      '</div></div>';
    document.body.appendChild(m);
    document.body.style.overflow = 'hidden';
    function close() { m.remove(); document.body.style.overflow = ''; history.replaceState(null, '', S.mode === 'want' ? '#wanted' : location.pathname); }
    m.querySelector('.x').onclick = close;
    m.onclick = function (e) { if (e.target === m) close(); };
    document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
    m.querySelector('#shareBtn').onclick = function () {
      var url = location.href.split('#')[0] + '#v=' + v.id;
      if (navigator.share) navigator.share({ title: title, text: title + ' — ' + rs(v.price), url: url }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { alert('Link copied'); });
      else prompt('Copy this link:', url);
    };
    if (!v.photos) return;
    G.id = v.id; G.i = 0; G.ids = [];
    try { G.ids = await call('publicPhotos', [v.id]); } catch (e) { G.ids = []; }
    galShow();
  }
  async function galShow() {
    var gal = $('gal'); if (!gal) return;
    if (!G.ids.length) { gal.innerHTML = ic('camera'); return; }
    var fid = G.ids[G.i];
    gal.innerHTML = '<div>Loading photo…</div>';
    try {
      if (!G.cache[fid]) G.cache[fid] = await call('publicPhoto', [G.id, fid]);
    } catch (e) { gal.innerHTML = '<div>Photo could not be loaded</div>'; return; }
    if (!$('gal')) return;
    gal.innerHTML = '<img src="' + G.cache[fid] + '" alt="Photo ' + (G.i + 1) + '">' +
      (G.ids.length > 1 ? '<button class="nav l" type="button" aria-label="Previous">' + ic('left') + '</button><button class="nav r" type="button" aria-label="Next">' + ic('right') + '</button>' : '') +
      '<span class="cnt">' + (G.i + 1) + ' / ' + G.ids.length + '</span>';
    var l = gal.querySelector('.l'), r = gal.querySelector('.r');
    if (l) l.onclick = function () { G.i = (G.i - 1 + G.ids.length) % G.ids.length; galShow(); };
    if (r) r.onclick = function () { G.i = (G.i + 1) % G.ids.length; galShow(); };
    var nx = G.ids[(G.i + 1) % G.ids.length];
    if (nx && !G.cache[nx]) call('publicPhoto', [G.id, nx]).then(function (d) { G.cache[nx] = d; }).catch(function () {});
  }

  // ---------- start ----------
  async function load() {
    $('grid').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    try {
      S.data = await call('publicListings', []);
      fillFilterLists();
      if (S.data.contact && S.data.contact.facebook) $('fFb').href = S.data.contact.facebook;
      fromHash();
    } catch (e) {
      $('grid').innerHTML = '<div class="empty">Could not load vehicles. ' + esc(e.message) +
        '<br><br><button class="btn pri" type="button" id="retry">' + ic('refresh') + ' Try again</button></div>';
      $('retry').onclick = load;
    }
  }
  load();
})();
</script>
</body>
</html>
