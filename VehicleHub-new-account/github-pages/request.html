<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VehicleHub — Buy or sell a vehicle</title>
<meta name="description" content="Tell us the vehicle you want to buy or sell — a VehicleHub agent will contact you.">
<meta name="theme-color" content="#1d3f8f">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>
  :root { --p:#1d3f8f; --p2:#2d5bd0; --ink:#172033; --mut:#5f6b7d; --bg:#f3f5f9; --line:#dde3ee; --ok:#1b7a3d; --bad:#c0392b; --or:#b86200; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Sinhala", "Iskoola Pota", Roboto, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 10px 14px; box-shadow: 0 6px 18px rgba(20,40,80,.05); }
  header { justify-content: center; }
  header .logo { height: 76px; width: auto; max-width: 86%; display: block; }
  .ic { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; }
  .badge-ic { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: 0 0 52px; }
  .badge-ic .ic { width: 28px; height: 28px; }
  .buy .badge-ic { background: #e8effd; color: var(--p2); }
  .sell .badge-ic { background: #fdf1e2; color: var(--or); }
  .h-ic { display: inline-flex; width: 34px; height: 34px; border-radius: 10px; align-items: center; justify-content: center; vertical-align: -8px; margin-right: 8px; }
  .h-ic.buy { background: #e8effd; color: var(--p2); } .h-ic.sell { background: #fdf1e2; color: var(--or); }
  .okc { width: 76px; height: 76px; border-radius: 50%; background: #e7f6ec; color: var(--ok); display: flex; align-items: center; justify-content: center; margin: 4px auto 10px; }
  .okc .ic { width: 42px; height: 42px; stroke-width: 2.4; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 6px 18px rgba(20,40,80,.05); margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; line-height: 1.3; }
  p.lead { margin: 0 0 14px; color: var(--mut); }
  .choice { display: grid; gap: 12px; }
  .choice button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 2px solid var(--line); background: #fff;
    border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; cursor: pointer; color: var(--ink); }
  .choice button small { display: block; font-weight: 400; color: var(--mut); font-size: 14px; }
  .choice .buy:hover, .choice .buy:focus { border-color: var(--p2); background: #f2f6ff; }
  .choice .sell:hover, .choice .sell:focus { border-color: var(--or); background: #fff8ef; }
  label.f { display: block; margin: 0 0 12px; }
  label.f > span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  label.f > span em { font-style: normal; color: var(--bad); }
  label.f > span i { font-style: normal; font-weight: 400; color: var(--mut); }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--p2); box-shadow: 0 0 0 3px rgba(45,91,208,.15); }
  textarea { min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sec { font-weight: 700; color: var(--p); margin: 6px 0 10px; font-size: 15px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 6px 0 12px; }
  .check input { width: 22px; height: 22px; flex: 0 0 22px; margin-top: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 13px 18px;
    font: inherit; font-weight: 700; cursor: pointer; background: #e8edf6; color: var(--ink); text-decoration: none; }
  .btn.pri { background: var(--p); color: #fff; width: 100%; font-size: 17px; }
  .btn.wa { background: #1faa53; color: #fff; width: 100%; font-size: 17px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--p); font: inherit; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 8px; }
  .back .ic { width: 18px; height: 18px; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin: 4px 0 8px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .photos .ph { position: relative; width: 88px; height: 66px; border-radius: 8px; background: #ddd center/cover; }
  .photos .ph button { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--bad); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .photos .ph button .ic { width: 14px; height: 14px; stroke-width: 3; }
  .muted { color: var(--mut); font-size: 13px; }
  .about { display: flex; gap: 10px; align-items: center; background: #eef3ff; color: var(--p); border-radius: 12px; padding: 10px 12px; margin: 4px 0 12px; font-size: 14px; }
  .done { text-align: center; }
  .ref { display: inline-block; background: #eef3ff; color: var(--p); font-weight: 800; font-size: 20px; padding: 6px 16px; border-radius: 10px; margin: 6px 0 12px; }
  .foot { text-align: center; font-size: 12px; color: var(--mut); margin: 18px 0 30px; }
  .spin { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  /* number-plate blur editor */
  .pe-back { position: fixed; inset: 0; background: rgba(10,16,24,.86); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 10px; }
  .pe { background: #fff; border-radius: 14px; padding: 14px; max-width: 760px; width: 100%; max-height: 96vh; overflow: auto; }
  .pe h3 { margin: 0 0 4px; font-size: 16px; }
  .pe canvas { width: 100%; height: auto; border-radius: 8px; touch-action: none; cursor: crosshair; margin: 8px 0; background: #eee; }
  .pe .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pe .row .btn { flex: 1 1 auto; padding: 10px 12px; }
  .pe .row .ok { background: #1faa53; color: #fff; }
  @media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
</style>
</head>

    send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'
  };
  function ic(n) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }


  function renderStart() {
    state.type = ''; state.done = null;
    $('app').innerHTML =
      '<div class="card"><h1>' + t('title') + '</h1><p class="lead">' + t('lead') + '</p>' +
      '<div class="choice">' +
      '<button type="button" class="buy" id="c_buy"><span class="badge-ic">' + ic('search') + '</span><span>' + t('buy') + '<small>' + t('buyS') + '</small></span></button>' +
      '<button type="button" class="sell" id="c_sell"><span class="badge-ic">' + ic('car') + '</span><span>' + t('sell') + '<small>' + t('sellS') + '</small></span></button>' +
      '</div><a class="btn" href="vehicles.html" style="width:100%;margin-top:12px">' + ic('car') + ' ' + t('showroom') + '</a></div>';
    $('c_buy').onclick = function () { state.type = 'buyer'; renderForm(); window.scrollTo(0, 0); };
    $('c_sell').onclick = function () { state.type = 'seller'; renderForm(); window.scrollTo(0, 0); };
  }

  function typeOptions(first) {
    return '<option value="">' + first + '</option>' + TYPES.map(function (x) {
      return '<option value="' + esc(x) + '">' + esc(x) + '</option>';
    }).join('');
  }
  function fld(id, label, attrs, hint, req) {
    return '<label class="f"><span>' + label + (req ? ' <em>*</em>' : '') + (hint ? ' <i>' + hint + '</i>' : '') + '</span><input id="' + id + '" ' + (attrs || '') + '></label>';
  }

  function renderForm() {
    var buyer = state.type === 'buyer', y = new Date().getFullYear();
    var yr = 'type="number" inputmode="numeric" min="1970" max="' + (y + 1) + '"';
    var lk = 'type="number" inputmode="decimal" step="0.1" min="0"';
    var h = '<div class="card"><button type="button" class="back" id="f_back">' + ic('left') + ' ' + t('back') + '</button>' +
      '<h1><span class="h-ic ' + (buyer ? 'buy' : 'sell') + '">' + ic(buyer ? 'search' : 'car') + '</span>' + (buyer ? t('buy') : t('sell')) + '</h1>' +
      (ABOUT ? '<div class="about">' + ic(buyer ? 'car' : 'search') + '<span>' + (buyer ? t('aboutV') : t('aboutB')) + ' <b>' + esc(ABOUT) + '</b>' +
        (PRE.make ? ' — ' + esc([PRE.make, PRE.model, qs.get('year') || ''].filter(Boolean).join(' ')) : '') + '</span></div>' : '') +
      '<form id="f" novalidate>' +
      '<div class="sec">' + (buyer ? t('buyTitle') : t('sellTitle')) + '</div>' +
      '<label class="f"><span>' + t('vtype') + (buyer ? '' : ' <em>*</em>') + '</span><select id="q_vehicle_type">' + typeOptions(buyer ? t('any') : t('select')) + '</select></label>' +
      '<div class="two">' +
        fld('q_make', t('make'), 'list="mk" autocomplete="off" placeholder="' + t('makePh') + '"', buyer ? '' : '', !buyer) +
        fld('q_model', t('model'), 'autocomplete="off" placeholder="' + t('modelPh') + '"', '', !buyer) +
      '</div>' + (buyer ? '<div class="muted" style="margin:-6px 0 10px">' + t('notSure') + '</div>' : '') +
      '<datalist id="mk">' + MAKES.map(function (m) { return '<option value="' + m + '">'; }).join('') + '</datalist>';
    if (buyer) {
      h += '<div class="two">' + fld('q_year_from', t('yFrom'), yr + ' placeholder="2012"') + fld('q_year_to', t('yTo'), yr + ' placeholder="' + y + '"') + '</div>' +
        '<div class="two">' + fld('q_min_budget', t('budMin'), lk + ' placeholder="40"') + fld('q_max_budget', t('budMax'), lk + ' placeholder="60"', '', true) + '</div>' +
        '<div class="muted" style="margin:-6px 0 10px">' + t('lakhsHint') + '</div>' +
        '<label class="check"><input type="checkbox" id="q_leasing"><span>' + t('leasing') + '</span></label>';
    } else {
      h += '<div class="two">' + fld('q_year', t('year'), yr + ' placeholder="2016"') + fld('q_price', t('price'), lk + ' placeholder="62.5"', '', true) + '</div>' +
        '<div class="muted" style="margin:-6px 0 10px">' + t('lakhsHint') + '</div>' +
        '<div class="sec">' + t('photos') + ' <span class="muted">' + t('optional') + '</span></div>' +
        '<div class="muted">' + t('photosHint') + '</div>' +
        '<div class="photos" id="ph"></div>' +
        '<input type="file" id="q_files" accept="image/*" multiple style="display:none">' +
        '<button type="button" class="btn" id="ph_add">' + ic('camera') + ' ' + t('addPhotos') + '</button><div style="height:12px"></div>';
    }
    h += '<div class="sec">' + t('you') + '</div>' +
      fld('q_name', t('name'), 'autocomplete="name" maxlength="80"', '', true) +
      fld('q_phone', t('phone'), 'type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX"', '', true) +
      fld('q_email', t('email'), 'type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com"', t('optional')) +
      '<label class="f"><span>' + t('notes') + ' <i>' + t('optional') + '</i></span><textarea id="q_notes" maxlength="500" placeholder="' + t('notesPh') + '"></textarea></label>' +
      '<div class="hp" aria-hidden="true"><label>Website <input id="q_website" tabindex="-1" autocomplete="off"></label></div>' +
      '<label class="check"><input type="checkbox" id="q_consent"><span>' + t('consent') + '</span></label>' +
      '<div class="err" id="f_err"></div>' +
      '<button class="btn pri" id="f_send" type="submit">' + ic('send') + ' ' + t('send') + '</button>' +
      '</form></div>';
    $('app').innerHTML = h;
    $('f_back').onclick = function () { state.photos = []; renderStart(); };
    $('f').onsubmit = submit;
    if (!buyer) {
      $('ph_add').onclick = function () { $('q_files').click(); };
      $('q_files').onchange = function () { addPhotos(this.files); this.value = ''; };
      drawPhotos();
    }
  }

  var FIELDS = ['vehicle_type', 'make', 'model', 'year_from', 'year_to', 'year', 'min_budget', 'max_budget', 'price', 'name', 'phone', 'email', 'notes'];
  function readForm() {
    var o = {};
    FIELDS.forEach(function (k) { var el = $('q_' + k); if (el) o[k] = el.value.trim(); });
    ['leasing', 'consent'].forEach(function (k) { var el = $('q_' + k); if (el) o[k] = el.checked; });
    return o;
  }
  function fillForm(o) {
    FIELDS.forEach(function (k) { var el = $('q_' + k); if (el && o[k] != null) el.value = o[k]; });
    ['leasing', 'consent'].forEach(function (k) { var el = $('q_' + k); if (el) el.checked = !!o[k]; });
  }

  // ---------- photos: resize + number-plate blur, all in the browser ----------
  function drawPhotos() {
    var box = $('ph'); if (!box) return;
    box.innerHTML = state.photos.map(function (u, i) {
      return '<div class="ph" style="background-image:url(\'' + u + '\')"><button type="button" data-i="' + i + '" aria-label="remove">' + ic('x') + '</button></div>';
    }).join('');
    box.querySelectorAll('button').forEach(function (b) { b.onclick = function () { state.photos.splice(+b.dataset.i, 1); drawPhotos(); }; });
    var add = $('ph_add'); if (add) add.style.display = state.photos.length >= MAX_PHOTOS ? 'none' : '';
  }
  async function addPhotos(files) {
    files = Array.prototype.slice.call(files || [], 0, MAX_PHOTOS - state.photos.length);
    for (var i = 0; i < files.length; i++) {
      var data;
      try { data = await resizeImage(files[i], 1280, 0.8); } catch (e) { continue; }
      data = await blurEditor(data, i + 1, files.length);
      if (data) { state.photos.push(data); drawPhotos(); }
    }
  }
  function resizeImage(file, max, q) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', q));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('bad image')); };
      img.src = url;
    });
  }
  function pixelate(ctx, b) {
    var x = Math.max(0, Math.round(b.x)), y = Math.max(0, Math.round(b.y));
    var w = Math.min(ctx.canvas.width - x, Math.round(b.w)), h = Math.min(ctx.canvas.height - y, Math.round(b.h));
    if (w < 2 || h < 2) return;
    var block = Math.max(10, Math.round(Math.min(w, h) / 4));
    var tc = document.createElement('canvas');
    tc.width = Math.max(1, Math.ceil(w / block)); tc.height = Math.max(1, Math.ceil(h / block));
    tc.getContext('2d').drawImage(ctx.canvas, x, y, w, h, 0, 0, tc.width, tc.height);
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(tc, 0, 0, tc.width, tc.height, x, y, w, h); ctx.restore();
  }
  function blurEditor(dataUrl, n, total) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var back = document.createElement('div'); back.className = 'pe-back';
        back.innerHTML = '<div class="pe"><h3>' + esc(t('pe_t')(n, total)) + '</h3><div class="muted">' + t('pe_h') + '</div>' +
          '<canvas id="pe_c"></canvas><div class="row"><button type="button" class="btn" id="pe_undo">' + ic('undo') + ' ' + t('pe_undo') + '</button>' +
          '<button type="button" class="btn" id="pe_skip">' + ic('x') + ' ' + t('pe_skip') + '</button><button type="button" class="btn ok" id="pe_ok">' + ic('check') + ' ' + t('pe_ok') + '</button></div></div>';
        document.body.appendChild(back);
        var c = back.querySelector('#pe_c'), ctx = c.getContext('2d');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        var boxes = [], start = null, cur = null;
        function redraw() {
          ctx.drawImage(img, 0, 0);
          boxes.forEach(function (b) { pixelate(ctx, b); });
          if (start && cur) { ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = Math.max(3, c.width / 300); ctx.setLineDash([12, 8]);
            ctx.strokeRect(start.x, start.y, cur.x - start.x, cur.y - start.y); ctx.setLineDash([]); }
        }
        function pos(e) { var r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; }
        c.addEventListener('pointerdown', function (e) { c.setPointerCapture(e.pointerId); start = cur = pos(e); });
        c.addEventListener('pointermove', function (e) { if (start) { cur = pos(e); redraw(); } });
        c.addEventListener('pointerup', function () {
          if (start && cur) { var b = { x: Math.min(start.x, cur.x), y: Math.min(start.y, cur.y), w: Math.abs(cur.x - start.x), h: Math.abs(cur.y - start.y) };
            if (b.w > 8 && b.h > 8) boxes.push(b); }
          start = cur = null; redraw();
        });
        redraw();
        function close(v) { back.remove(); resolve(v); }
        back.querySelector('#pe_undo').onclick = function () { boxes.pop(); redraw(); };
        back.querySelector('#pe_skip').onclick = function () { close(null); };
        back.querySelector('#pe_ok').onclick = function () { start = cur = null; redraw(); close(c.toDataURL('image/jpeg', 0.82)); };
      };
      img.onerror = function () { resolve(dataUrl); };
      img.src = dataUrl;
    });
  }

  // ---------- submit ----------
  function normPhone(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (d.length === 11 && d.indexOf('94') === 0) d = '0' + d.slice(2); else if (d.length === 9) d = '0' + d;
    return d;
  }
  async function submit(e) {
    e.preventDefault();
    var o = readForm(), err = $('f_err'), buyer = state.type === 'buyer';
    err.textContent = '';
    if (buyer && !o.max_budget) return fail(t('e_budget'), 'q_max_budget');
    if (!buyer && (!o.make || !o.model || !o.price)) return fail(t('e_seller'), !o.make ? 'q_make' : !o.model ? 'q_model' : 'q_price');
    if (!o.name) return fail(t('e_name'), 'q_name');
    if (!/^0\d{9}$/.test(normPhone(o.phone))) return fail(t('e_phone'), 'q_phone');
    if (o.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email)) return fail(t('e_email'), 'q_email');
    if (!o.consent) return fail(t('e_consent'), 'q_consent');
    if (!API || API.indexOf('PASTE_') === 0) return fail(t('e_cfg'));

    var payload = Object.assign({}, o, { about: ABOUT, type: state.type, phone: normPhone(o.phone), ref: REF, source: SRC, lang: lang,
      website: ($('q_website') || {}).value || '', photos: buyer ? [] : state.photos });
    var btn = $('f_send'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + t('sending');
    try {
      var res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: 'submitLead', args: [payload] }), redirect: 'follow' });
      var j = await res.json();
      if (!j || !j.ok) throw new Error((j && j.error) || 'error');
      state.photos = [];
      state.done = { ref: j.result.ref, officer: j.result.officer, name: o.name };
      renderDone(state.done); window.scrollTo(0, 0);
    } catch (ex) {
      btn.disabled = false; btn.innerHTML = ic('send') + ' ' + t('send');
      var m = String(ex && ex.message || '');
      err.textContent = (m && m !== 'error' && m.indexOf('Failed to fetch') === -1 && m.indexOf('NetworkError') === -1) ? m : t('e_net');
    }
    function fail(msg, focusId) { err.textContent = msg; if (focusId && $(focusId)) $(focusId).focus(); }
  }

  function renderDone(d) {
    var o = d.officer, wa = '';
    if (o && o.phone) {
      var num = '94' + String(o.phone).replace(/^0/, '');
      wa = 'https:/' + '/wa.me/' + num + '?text=' + encodeURIComponent(t('waMsg')(d.ref, d.name));
    }
    $('app').innerHTML = '<div class="card done"><div class="okc">' + ic('check') + '</div><h1>' + t('thanks') + '</h1>' +
      '<div class="muted">' + t('refL') + '</div><div class="ref">' + esc(d.ref) + '</div>' +
      '<p>' + (o ? esc(t('agent')(o.name)) : t('agentAny')) + '</p>' +
      (wa ? '<a class="btn wa" href="' + wa + '" target="_blank" rel="noopener">' + ic('chat') + ' ' + t('waBtn') + '</a><p class="muted">' + t('waHint') + '</p>' : '') +
      '<button type="button" class="btn" id="d_again" style="margin-top:8px">' + ic('plus') + ' ' + t('again') + '</button></div>';
    $('d_again').onclick = renderStart;
  }

  $('foot').textContent = t('foot');
  renderStart();
  if (START_TYPE) {
    state.type = START_TYPE; renderForm();
    var pre = {}; Object.keys(PRE).forEach(function (k) { if (PRE[k]) pre[k] = PRE[k]; });
    if (START_TYPE === 'seller') { delete pre.max_budget; delete pre.year_from; delete pre.year_to; }
    else { delete pre.year; }
    fillForm(pre);
  }
})();
</script>
