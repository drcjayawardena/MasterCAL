<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>APCal | 4W Lease Calculator</title>
  <link rel="stylesheet" href="styles.css?v=apcal-ui-20261103">
</head>
<body>
  <main class="page-shell">
    <nav class="tab-strip" aria-label="Calculator"><button class="tab active" type="button">4W Lease</button></nav>
    <form id="calculator" autocomplete="off">
      <section class="dashboard">
        <article class="panel facility-panel">
          <div class="panel-title"><h2>Facility Details</h2><span class="title-rule"></span></div>
          <div class="field-list">
            <label class="field"><span>Product type</span><select id="product"><option>REG CAR</option><option>DUAL PURPOSE</option><option>SMALL CAR</option><option>JAPANESE TRUCK / LORRY</option><option>INDIAN TRUCK / LORRY</option><option>INDIAN MINI TRUCK</option><option>AUTO LOANS</option></select></label>
            <label class="field"><span>Facility amount (LKR)</span><input id="facility" type="number" min="0" step="1000" value="4000000"></label>
            <label class="field"><span>BIC (%)</span><input id="bicRate" type="number" min="0" step="0.01" value="0"></label>
            <label class="field"><span>Insurance (LKR)</span><input id="insurance" type="number" min="0" step="100" value="0"></label>
            <label class="field"><span>Stamp duty</span><select id="stampMode"><option value="paid">INITIAL PAID</option><option value="capitalized">CAPITALIZED</option></select></label>
            <label class="field"><span>Period (months)</span><input id="period" type="number" min="1" max="72" step="1" value="72"></label>
            <label class="field"><span>IRR (%)</span><input id="irr" type="number" min="0" max="100" step="0.01" value="16"></label>
          </div>
          <div class="bullet-editor">
            <button id="addBullet" class="bullet-add" type="button">ADD BULLET PAYMENT</button>
            <div id="bulletRows" class="bullet-rows" aria-live="polite"></div>
          </div>
          <section class="payment-summary" aria-label="Rental calculation">
            <div class="metric-row"><div class="metric-label">Monthly rental</div><div class="metric-value" id="monthlyRental">0.00</div></div>
            <div class="stat-list">
              <div class="stat"><span>Rate per LKR 100,000</span><strong id="ratePer100k">0.00</strong></div>
              <div class="stat"><span>Total interest</span><strong id="totalInterest">0.00</strong></div>
              <div class="stat"><span>Total paid</span><strong id="totalPaid">0.00</strong></div>
              <div class="stat"><span>Amount financed</span><strong id="amountFinanced">0.00</strong></div>
            </div>
          </section>
        </article>
        <div class="workspace-blank" aria-hidden="true"></div>
      </section>
      <div class="actions"><button id="scheduleButton" class="primary-button" type="button" aria-expanded="false">SHOW RENTAL SCHEDULE</button></div>
    </form>
    <section id="scheduleSection" class="panel schedule-panel" hidden>
      <div class="schedule-heading"><div><p class="eyebrow">4W LEASE</p><h2>Rental Schedule</h2></div><button id="printButton" class="outline-button" type="button">Print schedule</button></div>
      <div class="table-wrap"><table><thead><tr><th>Month</th><th>Opening balance</th><th>Rental</th><th>Interest</th><th>Capital paid</th><th>Bullet payment</th><th>Closing balance</th><th>Total due</th></tr></thead><tbody id="scheduleRows"></tbody></table></div>
    </section>
  </main>
  <script src="app.js?v=apcal-ui-20261103"></script>
</body>
</html>
